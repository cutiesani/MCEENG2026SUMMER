er the Spleen and Stomach separate pure from impure where does the pure go? Where does the impure go? Page 44 of 134", "choices": {"a": "Pure goes to the Kidney; impure is sent to the Large Intestine", "b": "Pure goes to the Kidney and then sent up to the Lung, where it is diffused to nourish", "c": "Pure goes back up to the Lung where it is diffused to nourish the skin and muscles;", "d": "Pure goes back up to the Lung where it is diffused to nourish the skin and muscles;"}, "answer": "d", "category": "원론/기초"}, {"id": 585, "question": "Which of following herbs regulates Qi and transforms Phlegm?", "choices": {"a": "Chen Pi(Citri Reticulatae, Pericarpium)", "b": "Qing Pi(Citri Reticulatae Viride, Pericarpium)", "c": "Chen Xiang(Aquilariae Resinatum, Lignum)", "d": "Mu Xiang(Aucklandiae Radix)"}, "answer": "a", "category": "본초학"}, {"id": 586, "question": "Which of the following Elements is associated with utmost Yin?", "choices": {"a": "Earth", "b": "Liver", "c": "Metal", "d": "Water"}, "answer": "d", "category": "기타"}, {"id": 587, "question": "Which aspect of Heart is responsible for the transformation of Blood?", "choices": {"a": "Heart Yin, it flows down to the Kidneys", "b": "Heart Fire, it flows down to the Lower Burner", "c": "Essence, is transformed and stored", "d": "Heart Qi, it flows up"}, "answer": "b", "category": "임상의학"}, {"id": 588, "question": "Which of the following herbs enters the Liver and Kidney Channels?", "choices": {"a": "Bai Tou Weng(Pulsatillae)", "b": "Lu Dou (Phaseoli radiati Semen)", "c": "Qing Hao(Artemisiae annuae Herba)", "d": "Yu Xing Cao(Houttuyniae Herba)"}, "answer": "c", "category": "본초학"}, {"id": 589, "question": "Which of the following flavors is Yang in nature, scatters, tonifies, soothes, slows down acute diseases, harmonizes, regulates other herbs, and moistens?", "choices": {"a": "Sour", "b": "Sweet", "c": "Acrid/Pungent", "d": "Bitter"}, "answer": "b", "category": "본초학"}, {"id": 590, "question": "All of the following are true about T lymphocytes, EXCEPT that they:", "choices": {"a": "Mediate cellular immune response", "b": "Allow cytotoxic T cells to express CD8", "c": "Help T cells express CD4", "d": "Mature in the bone marrow"}, "answer": "d", "category": "기타"}, {"id": 591, "question": "What point treats splenomegaly due to Malaria?", "choices": {"a": "Ex-Si Feng", "b": "Ex-Pi Gen", "c": "Ex-Inner Nei Ting", "d": "Ex-Si Shen Cong"}, "answer": "b", "category": "기타"}, {"id": 592, "question": "All of the following organs are linked with the Kidney channel except the:", "choices": {"a": "Liver", "b": "Heart", "c": "Spleen", "d": "Lung"}, "answer": "c", "category": "원론/기초"}, {"id": 593, "question": "Which of the following acupuncture points is located on the neck, at the anterior border of the sternocleidomastoid muscle, midway between ST9(Ren Ying) and ST11(Qi She)?", "choices": {"a": "ST10(Shui Tu)", "b": "ST12(Que Pen)", "c": "ST1(Cheng Qi)", "d": "ST13(Qi Hu)"}, "answer": "a", "category": "침구학"}, {"id": 594, "question": "Which of the following herbs enters the Kidney and Bladder Channel?", "choices": {"a": "Lian Qiao(Forsythiae Fructus)", "b": "Huang Qin(Scutellariae Radix)", "c": "Huang Lian(Coptidis Rhizoma)", "d": "Huang Bai(Phellodendri Cortex)"}, "answer": "d", "category": "본초학"}, {"id": 595, "question": "The Wood point of Foot Jueyin is located in which of the following areas of the body?", "choices": {"a": "On the medial side of the big toe", "b": "On the web of the foot, between the first and second toes", "c": "On the lateral side of the big toe", "d": "In the depression, distal to the junction of the first and second metatarsal bones"}, "answer": "c", "category": "임상의학"}, {"id": 596, "question": "A two-year-old girl has a fever of 100°F and an inflamed sore throat. Her other symptoms include stuffy nose, thirst, and some sweating. The superficial venules of her index fingers are purple. Her tongue is red with thin yellow coat. Her pulse is rapid-superficial. Which of the following best describes the differential diagnosis for this patient?", "choices": {"a": "Common cold due to Wind-Heat", "b": "Common cold due to Damp-Heat", "c": "Common cold due to Wind-Cold", "d": "Common cold with retention of undigested food"}, "answer": "a", "category": "기타"}, {"id": 597, "question": "Which of the following herbs is the strongest for removing blood stasis?", "choices": {"a": "Dang Gui(Angelicae sinensis Radix)", "b": "Ai Ye(Mugwort)", "c": "Chuan Xiong(Chuanxiong Rhizoma)", "d": "Xing Ren(Armeniacae Semen)"}, "answer": "c", "category": "본초학"}, {"id": 598, "question": "A 67-year-old male has sore muscles and joints with limited range of motion. The pain moves from joint to joint every day. He has a slight cough but does not expectorate any phlegm. He has insomnia with frequent waking and difficulty falling asleep. He sweats easily during the day with little exertion and also finds his pillow wet during the night. He complains about dryness in the throat. At night, he likes to sleep with one foot sticking out of his blanket. Page 45 of 134 He has fatigue and a weak voice. He complains of poor memory, palpitations, and dizziness. When the weather changes, he easily catches cold. He has tinnitus and back pain. The pulse is Floating and Empty. The tongue is pale with a red tip. Which of the following diagnoses most accurately represents this case?", "choices": {"a": "Deficient Heart Yin, Wind Cold invades the Lung, and Deficient Kidney Yang", "b": "Deficient Qi, Deficient Blood, Deficient Yin, and Empty Fire", "c": "Deficient Kidney Yin, Deficient Qi, Deficient Heart Blood, and Wind Cold", "d": "Lung Qi Xu, Wind obstructing joints, and the Heart and Kidney not Harmonized"}, "answer": "d", "category": "해부생리"}, {"id": 599, "question": "Shortness of breath, wheezing, feeling of oppression in the chest, thirst, dizziness, and barking cough with expectoration of profuse yellow sputum. Which of the following diagnoses best suits this case?", "choices": {"a": "Lung Heat", "b": "Lung Cold Phlegm", "c": "Lung Wind Heat", "d": "Lung Phlegm Heat"}, "answer": "d", "category": "임상의학"}, {"id": 600, "question": "What points raise clear Yang for Deficiency Above and Excess Below or for Qi sinking, eliminates Internal Wind, calms the Mind, and restores consciousness?", "choices": {"a": "Du16(Feng Fu)", "b": "Du19(Hou Ding)", "c": "Du24(Shen Ting)", "d": "Du20(Bai Hui)"}, "answer": "d", "category": "기타"}, {"id": 601, "question": "Which of the following Elements is associated with growth?", "choices": {"a": "Fire", "b": "Water", "c": "Earth", "d": "Wood"}, "answer": "a", "category": "기타"}, {"id": 602, "question": "Which of the following blood borne pathogens is most likely to be passed to the practitioner by needlestick exposure?", "choices": {"a": "HA V", "b": "HBV", "c": "HCV", "d": "HIV"}, "answer": "b", "category": "임상의학"}, {"id": 603, "question": "Which of the following conditions is characterized by insomnia, feelings of worthlessness, fatigue, difficulty concentrating and weight loss?", "choices": {"a": "Bipolar disorder", "b": "Histrionic personality disorder", "c": "Major depressive disorder (MDD)", "d": "Generalized anxiety disorder (GAD)"}, "answer": "c", "category": "임상의학"}, {"id": 604, "question": "Which of the following points expels Wind, firms the Exterior, clears Heat, treats malaria, tonifies Deficiency, and pacifies Wind?", "choices": {"a": "Du12(Shen Zhu)", "b": "Du15(Ya Men)", "c": "Du14(Da Zhui)", "d": "Du16(Feng Fu)"}, "answer": "c", "category": "기타"}, {"id": 605, "question": "Which of the following Elements is associated with the fragrant/sweet smell?", "choices": {"a": "Earth", "b": "Wood", "c": "Metal", "d": "Water"}, "answer": "a", "category": "기타"}, {"id": 606, "question": "According to the American Hospital Association, which of the following conditions would NOT require you to refrain from patient direct contact?", "choices": {"a": "Streptococcal pharyngitis (strep throat)", "b": "Staphylococcal furuncle (boil)", "c": "Upper respiratory tract infection", "d": "Active influenza"}, "answer": "c", "category": "임상의학"}, {"id": 607, "question": "Which of the following acupuncture points is located on the posterolateral aspect of the hip joint, one third of the distance between the prominence of the greater trochanter and the sacrococcygeal hiatus (GV2)?", "choices": {"a": "GB29", "b": "BL30", "c": "GB30", "d": "Yaoyan (M-BW-24)"}, "answer": "c", "category": "침구학"}, {"id": 608, "question": "What dietary advice would you give to a patient with exterior wind cold?", "choices": {"a": "Pork and vegetables", "b": "Rice and vegetables", "c": "Salads and fruits", "d": "Chicken with ginger"}, "answer": "d", "category": "기타"}, {"id": 609, "question": "Which of the following Zang organs is closely related to water metabolism?", "choices": {"a": "Lung and Kidney", "b": "San Jiao and Kidney", "c": "Lung and San Jiao", "d": "Kidney and Spleen"}, "answer": "a", "category": "기타"}, {"id": 610, "question": "A Minute pulse indicates?", "choices": {"a": "Liver Qi Stagnation", "b": "Heart Yang Collapse", "c": "Liver Blood Deficiency", "d": "Stomach Yin Deficiency"}, "answer": "b", "category": "변증론"}, {"id": 611, "question": "In which direction does Kidney Water (Kidney Qi) move?", "choices": {"a": "Moves inward", "b": "Ascends", "c": "Descends", "d": "Moves in all directions"}, "answer": "b", "category": "임상의학"}, {"id": 612, "question": "Which of the following organs is responsible for the quality and length of sleep?", "choices": {"a": "Large Intestine", "b": "Gallbladder", "c": "Small Intestine", "d": "Bladder"}, "answer": "b", "category": "기타"}, {"id": 613, "question": "A 78 year old woman comes to you with heavy sensations and pain in the joints, especially her lower back and knees and ankles. She says she feels weak and stiff and is worse in the cold. She also has some numbness. Her tongue is pale with a white tongue coating and she has a thready, deficient, and slow pulse. What is her diagnosis?", "choices": {"a": "Wind Bi syndrome", "b": "Cold Bi syndrome", "c": "Damp Bi syndrome", "d": "Cold-Damp Bi syndrome"}, "answer": "d", "category": "해부생리"}, {"id": 614, "question": "Which of the following acupuncture points is located on the abdomen, in the depression at the lateral border of the rectus abdominis muscle level with the umbilicus?", "choices": {"a": "SP13(Fu She)", "b": "SP14(Fu Jie)", "c": "SP15(Da Heng)", "d": "SP16(Fu Ai)"}, "answer": "c", "category": "침구학"}, {"id": 615, "question": "Which of the following Elements is associated with the singing sound?", "choices": {"a": "Earth", "b": "Fire", "c": "Wood", "d": "Metal"}, "answer": "a", "category": "기타"}, {"id": 616, "question": "After the Small Intestine separates pure from impure where does the pure go? Where does the impure go?", "choices": {"a": "Pure goes to the Large Intestine; Impure goes to the Urinary Bladder", "b": "Pure goes to the Lung; Impure goes to the Large Intestine", "c": "Pure goes to the Kidney; Impure goes to the Urinary Bladder", "d": "Pure goes to the Urinary Bladder; Impure goes to the Large Intestine"}, "answer": "d", "category": "기타"}, {"id": 617, "question": "Which of the following acupuncture points is located 1.5 cun lateral to the lower border of the spinous process of the third thoracic vertebra (T3)?", "choices": {"a": "BL13(Fei Shu)", "b": "BL12(Feng Men)", "c": "BL3(Mei Chong)", "d": "BL14(Jue Yin Shu)"}, "answer": "a", "category": "침구학"}, {"id": 618, "question": "Which of the following Elements has the basic quality that it flares upwards? It is interpreted as heat or combustion. Its movement is upward.", "choices": {"a": "Wood", "b": "Earth", "c": "Fire", "d": "Water"}, "answer": "c", "category": "기타"}, {"id": 619, "question": "Which of the following best represents the correct order of steps in the cell cycle?", "choices": {"a": "G1 - mitosis - G2 - S", "b": "S - G1 - G2 - mitosis", "c": "G1 - S - G2 - mitosis", "d": "G1 - G2 - S2 - mitosis"}, "answer": "c", "category": "임상의학"}, {"id": 620, "question": "Which of the following herbs is acrid, aromatic, and warm?", "choices": {"a": "Bo He (Menthae haplocalycis Herba)", "b": "Xiang Ru (Moslae Herba)", "c": "Qiang Huo (Notopterygii Rhizoma seu Radix)", "d": "Zi Su Ye (Perillae Folium)"}, "answer": "d", "category": "본초학"}, {"id": 621, "question": "Which of the following organs is the first to separate pure from impure?", "choices": {"a": "Spleen", "b": "Small Intestine", "c": "Kidney", "d": "Lung"}, "answer": "a", "category": "기타"}, {"id": 622, "question": "According to the theory of interrelationship of Five Elements, which of the following choices best describes the condition of Kidney-Yang Deficiency leading to Spleen-Yang Deficiency manifesting as chronic diarrhea?", "choices": {"a": "The Water fails to generate the Earth", "b": "The Water insults on the Earth", "c": "The Earth overacts the Water", "d": "None is correct"}, "answer": "b", "category": "변증론"}, {"id": 623, "question": "Which of the following cranial nerves are involved in the sense of taste?", "choices": {"a": "Cranial nerve VII", "b": "Cranial nerve III", "c": "Cranial nerve XII", "d": "Cranial nerve IV"}, "answer": "a", "category": "해부생리"}, {"id": 624, "question": "Epistaxis is a common complaint that is typically benign and self-limiting. What is the most common site of epistaxis?", "choices": {"a": "Posterior", "b": "Anterior", "c": "Superficial", "d": "Internal"}, "answer": "b", "category": "기타"}, {"id": 625, "question": "The small intestine region of the GI tract consists of which of the following in correct order:", "choices": {"a": "Ileum - Jejunum - Duodenum", "b": "Duodenum - Jejunum - Ileum", "c": "Jejunum - Ileum - Duodenum", "d": "Duodenum - Ileum - Jejunum"}, "answer": "b", "category": "임상의학"}, {"id": 626, "question": "Which of the following is the correct dosage for the herb Lu Dou(Phaseoli radiati Semen)?", "choices": {"a": "9-15 g", "b": "15-30 g", "c": "30-60 g", "d": "3-9 g"}, "answer": "b", "category": "본초학"}, {"id": 627, "question": "What are the pathological manifestations of the primary channel of the Hand Jueyin channel?", "choices": {"a": "Cardiac pain, palpitations, mental restlessness, stuffiness in the chest, flushed face,", "b": "Cardiac pain, palpitations, hypochondriac pain, insomnia, night sweating, thirst", "c": "Abdominal distension, edema, dysuria, tinnitus, deafness", "d": "Low back pain, fullness in the chest, pain in the lower abdomen, vertical headache,"}, "answer": "a", "category": "원론/기초"}, {"id": 628, "question": "Which of the following single herbs treats Damp-related dermatosis affecting the hands or feet?", "choices": {"a": "Cang Zhu(Rhizoma Atractylodis)", "b": "Qian Hu(Radix Peucedani)", "c": "Huo Xiang(Pogostemonis Herba)", "d": "Mu Gua(Fructus Chaenomelis)"}, "answer": "c", "category": "본초학"}, {"id": 629, "question": "A patient comes to your office seeking acupuncture treatment for his cough. He complains that it is very painful, with profuse yellow sputum. You notice while he is talking that his face is very red. Which of the following is the most likely diagnosis for this patient?", "choices": {"a": "Chronic Lung Heat", "b": "Fire Overacting upon Metal", "c": "Lung Yin Deficiency", "d": "Metal Counteracting Fire"}, "answer": "b", "category": "변증론"}, {"id": 630, "question": "Which of the following acupuncture points is located on the lateral side of the chest, in the second intercostal space, 6 cun lateral to the midline?", "choices": {"a": "GB24(Ri Y ue)", "b": "ST20(Cheng Man)", "c": "SP20(Zhou Rong)", "d": "LU2(Yun Men)"}, "answer": "c", "category": "침구학"}, {"id": 631, "question": "The CNT Manual strongly recommends that when inserting a needle into the guide tube the needle is inserted in which of the following ways?", "choices": {"a": "You should only use needles with guide tubes attached.", "b": "while the needle is in the package", "c": "Tip first", "d": "Handle first"}, "answer": "d", "category": "기타"}, {"id": 632, "question": "Poor appetite, weakness and coldness of the limbs, loose stools, a desire to lie down curled up, pale complexion, and edema. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Spleen Yang Deficiency", "b": "Spleen Qi Deficiency", "c": "Spleen Cold Damp", "d": "Spleen Qi Sinking"}, "answer": "a", "category": "변증론"}, {"id": 633, "question": "Following is/are the herb(s) that belong to the category of yin tonics:", "choices": {"a": "Mai Men Dong(Ophiopogonis Rx.)", "b": "Bai He(Lilii Bulbus)", "c": "Gui Ban(Testudinis Plastrum)", "d": "All of the above are correct"}, "answer": "d", "category": "본초학"}, {"id": 634, "question": "Which of the following acupuncture points is located on the side of the head, directly level with the apex of the ear when the ear is folded forwards?", "choices": {"a": "TE23(Si Zhu Kong)", "b": "TE20(Jiao Sun)", "c": "TE22(Er Men)", "d": "TE19(Lu Xi)"}, "answer": "b", "category": "침구학"}, {"id": 635, "question": "Which of the following acupuncture points is located on the lateral side of the foot, in the depression posterior and inferior to the head of the fifth metatarsal bone?", "choices": {"a": "BL65(Shu Gu)", "b": "BL66(Zu Tong Gu)", "c": "BL63(Jin Men)", "d": "BL64(Jing Gu)"}, "answer": "a", "category": "침구학"}, {"id": 636, "question": "Hypertension, dry throat, tremor, poor memory, insomnia numbness/tingling of the limbs, and headache. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Liver Wind from Liver and Kidney Yin Deficiency causing Liver Yang Rising", "b": "Liver Qi Stagnation", "c": "Liver Wind from Liver Blood Deficiency causing Liver Yang Rising", "d": "Liver Wind from Liver Qi Stagnation causing Liver Yang Rising"}, "answer": "c", "category": "변증론"}, {"id": 637, "question": "Which of the following acupuncture points is the empirical point for epilepsy?", "choices": {"a": "DU3(Yao Yang Guan)", "b": "Ex-Yao Qi", "c": "DU4(Ming Men)", "d": "Ex-Yao Yan"}, "answer": "b", "category": "침구학"}, {"id": 638, "question": "What is the distance between the Jing-river and Shu-stream points of the Foot Shao Yin meridian?", "choices": {"a": "2 cun", "b": "1 cun", "c": "3 cun", "d": "3.5 cun"}, "answer": "a", "category": "침구학"}, {"id": 639, "question": "The ear ringing with a low-pitched noise like rushing water indicates:", "choices": {"a": "Kidney-yin deficiency", "b": "Liver-yang rising", "c": "Liver-fire Blazing upwards", "d": "Gallbladder-fire misting the clear orifices"}, "answer": "a", "category": "변증론"}, {"id": 640, "question": "Which of the following organs 1) diffuses Body Fluids, 2) transforms and transports Body Fluids, and 3) transforms, separates, and excretes Body Fluids, respectively?", "choices": {"a": "Lung; Spleen; Kidney", "b": "Spleen; Lung; Small Intestines", "c": "Kidney; Stomach; Urinary Bladder", "d": "Stomach; Spleen, Urinary Bladder"}, "answer": "a", "category": "임상의학"}, {"id": 641, "question": "Dull abdominal pain, pale urine, loose stools like duck droppings, and borborygmi. Which of the following is the best diagnosis for this case?", "choices": {"a": "Large Intestine Deficiency Cold", "b": "Large Intestine Heat", "c": "Large Intestine Dryness", "d": "Large Intestine Collapse"}, "answer": "a", "category": "기타"}, {"id": 642, "question": "Which of the following is true about Mutual Antagonism?", "choices": {"a": "Combination of two substances leads to side-effects or toxicity that is not caused by", "b": "One substance's toxicity or side effects are reduced or eliminated by another", "c": "The ability of two substances to minimize or neutralize each other's positive effects", "d": "Combination of two or more substances with similar functions to accentuate their"}, "answer": "c", "category": "임상의학"}, {"id": 643, "question": "Which of the following signs are considered a good therapeutic response when performing intradermal needles?", "choices": {"a": "Stabbing sensation", "b": "No sensation", "c": "Distending sensation", "d": "Hot and numb sensation"}, "answer": "d", "category": "기타"}, {"id": 644, "question": "Which of the following points regulates menstruation and invigorates Blood, harmonizes the Spleen and resolves Dampness as well as moderates acute conditions?", "choices": {"a": "SP9(Yin Ling Quan)", "b": "SP21(Da Bao)", "c": "SP8(Di Ji)", "d": "SP4(Gong Sun)"}, "answer": "c", "category": "기타"}, {"id": 645, "question": "Which of the following is not an WHO, CDC, and OSHA standards for cleaning and disinfecting?", "choices": {"a": "The location kept clean and sanitary", "b": "Verbal notification sent to cleaning contractors regarding the presence of", "c": "A sink with hot and cold running water, liquid hand soap, and paper towels is", "d": "Written schedule kept for cleaning and decontamination"}, "answer": "b", "category": "임상의학"}, {"id": 646, "question": "Which of the following parts of the ear contain auricular acupuncture points that treat toothaches, headaches, and eye pain?", "choices": {"a": "Antitragus", "b": "Antihelix", "c": "Helix", "d": "Tragus"}, "answer": "a", "category": "침구학"}, {"id": 647, "question": "Apart from the principal points such as BL17(Ge Shu), PC 6(Nei Guan), and Ren12(Zhong Wan), which of the following points would you select as supplementary points to treat hiccups caused by the stagnation of Qi?", "choices": {"a": "Ren17(Tan Zhong) and LR3(Tai Chong)", "b": "Ren14(Ju Que) and Extra point Inner Nei Ting", "c": "Ren13(Shang Wan) and ST36(Zu San Li)", "d": "ST18(Ru Gen) and BL18(Gan Shu)"}, "answer": "a", "category": "침구학"}, {"id": 648, "question": "Which of the following Elements is associated with the rancid/goatish/fetid smell?", "choices": {"a": "Wood", "b": "Metal", "c": "Fire", "d": "Earth"}, "answer": "a", "category": "기타"}, {"id": 649, "question": "Which of the following acupuncture points is located on the thigh, on a line drawn between the lateral border of the patella and the anterior superior iliac spine, in a depression 2 cun proximal to the superior border of the patella?", "choices": {"a": "ST34(Liang Qiu)", "b": "LR7(Xi Guan)", "c": "ST35(Du Bi)", "d": "Ex-Xi Yan"}, "answer": "a", "category": "침구학"}, {"id": 650, "question": "Which spinal nerve is related with the Achilles tendon reflex?", "choices": {"a": "L4", "b": "L5", "c": "S1", "d": "S2"}, "answer": "c", "category": "해부생리"}, {"id": 651, "question": "Which organ(s) control(s) the Ye Fluids?", "choices": {"a": "Lung", "b": "Kidney", "c": "Liver", "d": "Spleen"}, "answer": "b", "category": "기타"}, {"id": 652, "question": "Which of the following herbs travel to the Leg Terminal Yin(Jue Yin) Channel?", "choices": {"a": "Lian Qiao (Fructus Forsythiae Suspensae) and Bai Zhi(Angelicae dahuricae Radix)", "b": "Jie Geng(Platycodi Radix) and Sheng Ma(Cimicifugae Rhizoma)", "c": "Chuan Xiong(Chuanxiong Rhizoma) and Chai Hu(Bupleuri Radix)", "d": "Shi Gao(Gypsum Fibrosum) and Ge Gen(Puerariae Radix)"}, "answer": "c", "category": "본초학"}, {"id": 653, "question": "You have accidently dropped just-used acupuncture needles on the floor. You have appropriately picked them up and discarded them. The next steps include doing all of the following, EXCEPT:", "choices": {"a": "Before the floor clean up swab hands with an alcohol disinfectant", "b": "After the clean up wash hands", "c": "All materials used in floor cleaning shound be double wrapped and discarded", "d": "Disinfect the floor 2 times with 1:10 bleach dilution"}, "answer": "c", "category": "임상의학"}, {"id": 654, "question": "Which of the following symptoms does Jing-Well points most commonly treat? Page 49 of 134", "choices": {"a": "Traumatic injury", "b": "Clearing excess and Heat", "c": "Atrophy", "d": "Painful obstruction"}, "answer": "b", "category": "임상의학"}, {"id": 655, "question": "A 65-year-old man complains of severe dizziness, vertigo, blurred vision, and headache. He has low back pain, weak knees, and a red tongue with no coat. What is the correct Five Element pattern diagnosis?", "choices": {"a": "Wood overacting on Earth", "b": "Water not generating Wood", "c": "Fire insulting Water", "d": "Water overacting on Fire"}, "answer": "b", "category": "변증론"}, {"id": 656, "question": "Which of the following acupuncture points is located on the medial aspect of the lower leg, in the depression 2 cun superior to KI3, on the anterior border of the achilles tendon?", "choices": {"a": "KI3(Tai Xi)", "b": "KI7(Fu Liu)", "c": "KI6(Zhao Hai)", "d": "KI4(Da Zhong)"}, "answer": "b", "category": "침구학"}, {"id": 657, "question": "Which of the following flavors is Yin in nature, drains, purges and dries, descends Rebellious Qi(Purgative), dries Damp, and dispels Heat?", "choices": {"a": "Sweet", "b": "Acrid/Pungent", "c": "Bitter", "d": "Sour"}, "answer": "c", "category": "본초학"}, {"id": 658, "question": "Aqueous Trituration is a method used to prepare herbs for which of the following conditions?", "choices": {"a": "Colon issues", "b": "Digestive issues", "c": "Triple Burner issues", "d": "Eye issues"}, "answer": "d", "category": "본초학"}, {"id": 659, "question": "Which of the following is NOT true about Hepatitis B Virus(HBV)?", "choices": {"a": "OSHA requires all employers to offer HBV vaccination to health care workers", "b": "CDC recommends that all health care workers be vaccinated against HBV", "c": "The HBV vaccination consists of a series of three injections", "d": "Approximately 70% of those infected have no signs or symptoms"}, "answer": "d", "category": "해부생리"}, {"id": 660, "question": "Which extra point treats excessive Heat, finger numbness, spasm and swelling of the dorsum of the hand?", "choices": {"a": "Ba Xie", "b": "Ba Feng", "c": "Yao Tong Xue", "d": "Luo Zhen"}, "answer": "a", "category": "기타"}, {"id": 661, "question": "Which of the following acupuncture points is located on the cubital crease of the elbow, in the depression at the radial side of the tendon of biceps brachii?", "choices": {"a": "LU6", "b": "PC3", "c": "LU5", "d": "HT3"}, "answer": "c", "category": "침구학"}, {"id": 662, "question": "The Luo Connecting point of the Hand Yangming Channel is how far from the Xi Cleft point of the Hand Yangming Channel?", "choices": {"a": "3 cun", "b": "2 cun", "c": "5 cun", "d": "1 cun"}, "answer": "b", "category": "임상의학"}, {"id": 663, "question": "Which of the following acupuncture points is located on the dorsal aspect of the ring finger, at the junction of lines drawn along the ulnar border of the nail and the base of the nail, approximately 0.1 cun from the corner of the nail?", "choices": {"a": "TE2(Ye Men)", "b": "TE1(Guan Chong)", "c": "TE22(Er Men)", "d": "TE23(Si Zhu Kong)"}, "answer": "b", "category": "침구학"}, {"id": 664, "question": "A female patient says she has always been very shy since she was a small child. She often feels afraid to try new things. She has a lot of anxiety and is very jumpy. She is going through a divorce which is causing her a lot of anxiety. She finds that she is either crying a lot or is very angry about her situation. She is very depressed. She has pain in her flanks that is worse before her menstrual cycle. Recently, she tells you she felt very cold even though it is summer. Her legs are swollen like sausages. When asked if she has abundant clear urination, she tells you that it is actually clear but it’s not very much. She says that she is able to hear her heart beat quite loudly in her chest and she is breathless. Her hands are also cold. Her tongue is pale, swollen and wet in the rear. Her pulse is overall Weak, Wiry on the left middle position and Deep, Weak and Slow on the rear positions. What is the diagnosis for this case?", "choices": {"a": "Kidney and Heart Yang Deficiency with Liver Qi Stagnation", "b": "Kidney Yang Deficiency with Damp, GB Qi Deficiency with Stomach Qi Stagnation", "c": "Kidney Yin Deficiency with Heart Yang Deficiency with GB Qi Deficiency and", "d": "Kidney Yang Deficiency with Water overflowing to the Heart, GB Qi Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 665, "question": "What is the expected incubation period of Hepatitis B?", "choices": {"a": "15-50 days", "b": "50-90 days", "c": "20-90 days", "d": "45-160 days"}, "answer": "d", "category": "임상의학"}, {"id": 666, "question": "The waxing moon, from the new moon to the full moon, interpreted in Yin and Yang theory, is:", "choices": {"a": "Yang within Yin", "b": "Yin within Yang", "c": "Full Yin", "d": "Full Yang"}, "answer": "a", "category": "원론/기초"}, {"id": 667, "question": "When does menstrual bleeding occur?", "choices": {"a": "Estrogen and progesterone increase", "b": "Estrogen increases and progesterone decreases", "c": "Estrogen decreases and progesterone increases", "d": "Estrogen and progesterone decrease"}, "answer": "d", "category": "기타"}, {"id": 668, "question": "Which of following points treats sores of the lower region, wind rash, itching of the skin?", "choices": {"a": "Ex-Bai Chong Wo", "b": "Ex-Zi Gong Xue", "c": "Ex-Yao Yan", "d": "Ex-Inner Nei Ting"}, "answer": "a", "category": "기타"}, {"id": 669, "question": "A 67-year-old man suffers from diabetes for 21 years. Excessive thirst and eating are not much of a problem for him, but he does suffer from excessive, profuse urination. His other symptoms include dark complexion, weakness in the lower back and knees, aversion to cold, cold limbs, and diarrhea. His tongue is pale with dry whitish coat. His pulse is thready- deficient. Which of the following best describes the differential diagnosis for this patient?", "choices": {"a": "Diabetes due to Lung Heat damaging the body fluid", "b": "Diabetes due to abundance of Stomach Fire", "c": "Diabetes due to deficient Kidney Yin", "d": "Diabetes due to deficient Yin and Yang"}, "answer": "d", "category": "임상의학"}, {"id": 670, "question": "Sneezing, blocked/runny nose with yellow discharge, headache and body aches, and aversion to cold with slight sweating. Which of the following diagnoses best describes this case?", "choices": {"a": "Lung Wind Cold", "b": "Lung Dryness", "c": "Lung Wind Heat", "d": "Lung Heat"}, "answer": "c", "category": "기타"}, {"id": 671, "question": "Your 57-year-old female patient has been told by her physician that she would like to schedule a cystoscopy for her. This exam is used to scan which of the following organs?", "choices": {"a": "Ovary", "b": "Bladder", "c": "Gallbladder", "d": "Small intestine"}, "answer": "b", "category": "기타"}, {"id": 672, "question": "Tremor and/or facial tic, hypertension, dry throat and dry eyes with blurred vision, numbness/tingling of the limbs, and headache. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Thin body, thin coat; Wiry, Slightly Rapid", "b": "Normal body, no coat; Wiry, Fine", "c": "Red body, no coat; Fine, Slightly Rapid", "d": "Normal body, thick white coat; Wiry"}, "answer": "b", "category": "임상의학"}, {"id": 673, "question": "How many front-Mu points are there on the Ren meridian?", "choices": {"a": "3", "b": "4", "c": "5", "d": "6"}, "answer": "d", "category": "침구학"}, {"id": 674, "question": "A patient has abnormal uterine bleeding with a sudden onset of profuse and continuous blood flow which is deep red, insomnia and restlessness, red eyes, and chest distention. The tongue is red with yellow coating. The pulse is fast. What is the pattern?", "choices": {"a": "Excess heat", "b": "Phlegm heat", "c": "Spleen not containing blood", "d": "Empty heat residing in blood"}, "answer": "a", "category": "변증론"}, {"id": 675, "question": "Which of the following acupuncture points is located with the eyes looking directly forwards, where the point is located directly below the pupil, level with the lower border of the ala nasi, and on the lateral side of the nasolabial groove?", "choices": {"a": "Jiachengjian (M-HN-18)", "b": "ST3", "c": "LI19", "d": "GB14"}, "answer": "b", "category": "침구학"}, {"id": 676, "question": "Which of the following is the correct dosage for the herb Dai Zhe Shi(Haematitum)?", "choices": {"a": "6-15g in decoction; 1-1.5g when powdered and swallowed", "b": "9-30g in decoctions (crushed); 1-3g in pills and powders", "c": "3-9g in decoctions (crushed); 1-3g in pills and powders", "d": "30-90g in decoction; 3-9g when powdered and swallowed"}, "answer": "b", "category": "본초학"}, {"id": 677, "question": "Which of the following herbs do not Calm the Fetus?", "choices": {"a": "Dong Kui Zi (Malvae Fructus), Dan Shen (Rx Salviae Miltiorrhizae), Wang Bu Liu", "b": "Ai Ye (Artemisia Vulgaris, Huang Qin (Rz. Scutellariae), Sha Ren (Amomi Fructus)", "c": "Xu Duan (Dipsaci Radix), Tu Si Zi (Semen Cuscutae), Bai Zhu (Atractylodis", "d": "E Jiao (Asini Corii Colla), Sang Ji Sheng (Herba Taxilli, Du Zhong (Eucommiae"}, "answer": "a", "category": "본초학"}, {"id": 678, "question": "Which of the following acupuncture points is the empirical point for non-substantial Phlegm?", "choices": {"a": "PC5(Jian Shi)", "b": "PC4(Xi Men)", "c": "PC6(Nei Guan)", "d": "ST40(Feng Long)"}, "answer": "a", "category": "침구학"}, {"id": 679, "question": "Which of the following conditions is contraindicated with plum-blossom needling?", "choices": {"a": "Headache", "b": "Itching skin", "c": "Skin ulcer", "d": "Indigestion"}, "answer": "c", "category": "침구학"}, {"id": 680, "question": "Which of the following vitamin deficiencies is characterized by poor night vision, damage to cornea, and dry or cracked skin?", "choices": {"a": "Vitamin B deficiency", "b": "Vitamin C deficiency", "c": "Vitamin A deficiency", "d": "Vitamin D deficiency"}, "answer": "c", "category": "임상의학"}, {"id": 681, "question": "Which of the following types of Hepatitis never becomes chronic?", "choices": {"a": "Hepatitis A", "b": "Hepatitis B", "c": "Hepatitis C", "d": "All types of hepatitis become chronic"}, "answer": "a", "category": "임상의학"}, {"id": 682, "question": "Which of the following indicates the adverse effects of Ibuprofen (eg. Motrin, Advil)?", "choices": {"a": "GI bleeding", "b": "Loss of fine motor skills", "c": "Constriction of the large bronchioles", "d": "Pupil constriction"}, "answer": "a", "category": "임상의학"}, {"id": 683, "question": "Electroacupuncture is NOT contraindicated for which of the following areas?", "choices": {"a": "Crossing the heart", "b": "Anterior triangle of the neck", "c": "Yintang to Du20(Bai Hui), Du20(Bai Hui) - GB20(Feng Chi), and Si Shen Cong", "d": "Upper posterior cervical area"}, "answer": "c", "category": "임상의학"}, {"id": 684, "question": "Which organ makes and hold Blood? Stores Blood? Governs Blood?", "choices": {"a": "Kidney, Spleen, and Liver", "b": "Spleen, Liver, and Heart", "c": "Liver, Spleen, and Heart", "d": "Liver, Lung, and Spleen"}, "answer": "b", "category": "기타"}, {"id": 685, "question": "Which of the following Elements is associated with the center?", "choices": {"a": "Liver", "b": "Metal", "c": "Earth", "d": "Water"}, "answer": "c", "category": "기타"}, {"id": 686, "question": "The shoulder point is located on the Scapha level with what other anatomical feature of the ear?", "choices": {"a": "Lobe", "b": "Supertragic notch", "c": "Intertragic notch", "d": "Superior crus of the antihelix"}, "answer": "b", "category": "기타"}, {"id": 687, "question": "A 65 year-old man has had Parkinson’s disease for fifteen years. When it started he first experienced poor concentration and memory, insomnia and dizziness. A few months later he developed a tremor in his head with stiffness of the neck and difficulty walking. These symptoms continue until this day. Additional symptoms include dry mouth, blurry vision, nausea, and a nasal discharge. The tongue is red with greasy yellow coating. The pulse is slippery (hua mai) and slightly wiry (xuan mai). What is the diagnosis?", "choices": {"a": "Extreme heat generating wind", "b": "Deficient Liver blood causing wind", "c": "Phlegm-heat; Liver yang rising causing wind", "d": "Stomach phlegm-heat"}, "answer": "c", "category": "기타"}, {"id  Sp yang deficiency", "c": "KD yang deficiency with water overflow", "d": "UB damp cold"}, "answer": "c", "category": "변증론"}, {"id": 693, "question": "Which of the following organs stores Blood?", "choices": {"a": "Liver", "b": "Kidney", "c": "Heart", "d": "Spleen"}, "answer": "a", "category": "기타"}, {"id": 694, "question": "Which of the following points treats Phlegm Heat in the Lungs or Phlegm in the Lungs, treats hemoptysis, Lung disorders and Wei Syndrome, local point or adjacent point for Bi Syndrome?", "choices": {"a": "LU7", "b": "LU5", "c": "LU1", "d": "LU6"}, "answer": "b", "category": "기타"}, {"id": 695, "question": "Concomitant use of diuretic herbs such as Fu Ling(Poria), Zhu Ling(Polypori Umbellati), Che Qian Zi(Semen Plantaginis), and Ze Xie(Alismatis Rhizoma) with diuretic drugs may cause:", "choices": {"a": "Dehydration", "b": "Hypotension", "c": "Hypertension", "d": "Blood stasis"}, "answer": "a", "category": "본초학"}, {"id": 696, "question": "Which of the following acupuncture points is located 1.5 cun lateral to the lower border of the spinous process of the sixth thoracic vertebra?", "choices": {"a": "BL61(Fu Shen)", "b": "BL16(Du Shu)", "c": "BL17(Ge Shu)", "d": "BL15(Xin Shu)"}, "answer": "b", "category": "침구학"}, {"id": 697, "question": "Which of the following measures is the most important to preventing cross- infection?", "choices": {"a": "Wearing a gown", "b": "Wearing gloves", "c": "Wearing a mask", "d": "Hand washing"}, "answer": "d", "category": "임상의학"}, {"id": 698, "question": "Which is NOT an indication for head acupuncture (or scalp acupuncture)?", "choices": {"a": "Unsteadiness due to cerebellum atrophy", "b": "Muscular atrophy due to frozen shoulder", "c": "Hemiplegia", "d": "Dizziness due to hypertension"}, "answer": "b", "category": "임상의학"}, {"id": 699, "question": "Which of the following substances is Yin in nature? It is more turbid, heavy and dense. It circulates with the Nutritive Qi in the Interior. It moves relatively slowly. It , "d": "One day"}, "answer": "a", "category": "본초학"}, {"id": 759, "question": "Which of the following is the ideal solo first responder’s Compression-Ventilation ratio without advanced airway for children?", "choices": {"a": "30 compressions; 2 ventilations", "b": "15 compressions; 1 ventilations", "c": "2 compressions; 15 ventilations", "d": "20 compressions; 2 ventilations"}, "answer": "a", "category": "기타"}, {"id": 760, "question": "CNT recommends that written patient records be completed using which of the following?", "choices": {"a": "Black non-erasable ink", "b": "Red ink", "c": "Blue erasable ink", "d": "Electronic health records only"}, "answer": "a", "category": "해부생리"}, {"id": 761, "question": "Which of the following channels cross at ST1?", "choices": {"a": "Stomach and Gallbladder", "b": "Stomach and Yang Qiao", "c": "Stomach, Conception Vessel, and Yang Qiao", "d": "Stomach, Large Intestine, Conception Vessel, and Yang Qiao"}, "answer": "c", "category": "원론/기초"}, {"id": 762, "question": "Which poses the greatest risk in an acupuncture clinic?", "choices": {"a": "Streptococcus", "b": "Hepatitis C", "c": "HIV", "d": "Hepatitis B"}, "answer": "d", "category": "임상의학"}, {"id": 763, "question": "Which of the following points is a crossing point of the Gallbladder and Urinary Bladder Channels and treats sciatica pain?", "choices": {"a": "GB34(Yang Ling Quan)", "b": "GB30(Huan Tiao)", "c": "GB24(Ri Y ue)", "d": "GB26(Dai Mai)"}, "answer": "b", "category": "침구학"}, {"id": 764, "question": "Qi commands Blood, and Blood nourish Qi. In other words, Qi _____ Blood; and Blood _____ Qi.", "choices": {"a": "Generates, moves and holds; nourishes", "b": "Harmonizes, harbors and holds; replenishes", "c": "Transforms, holds and separates; generates", "d": "Transports, harmonizes and moistens; governs"}, "answer": "a", "category": "기타"}, {"id": 765, "question": "Which of the following single herbs stimulates hair growth for alopecia (topical and tincture)?", "choices": {"a": "Bai Zhu (Atractylodis macrocephalae Rhizoma)", "b": "Shan Yao (Dioscoreae Rhizoma)", "c": "Gu Sui Bu (Drynariae Rhizoma)", "d": "Xian Mao (Curculiginis Rhizoma)"}, "answer": "c", "category": "본초학"}, {"id": 766, "question": "Which of the following can indicate the health of the radial nerve?", "choices": {"a": "Grip strength", "b": "Extension at the wrist", "c": "One-handed clap", "d": "Elbow flexion"}, "answer": "b", "category": "해부생리"}, {"id": 767, "question": "Five Window of Heaven/Sky points have an effect on sense organs. Which of the following sky points is wrongly associated with eye symptoms?", "choices": {"a": "SI11(Tian Zong): burning eye pain, dimness of vision", "b": "ST9(Ren Ying): visual dizziness", "c": "BL10(Tian Zhu): eye pain, red eyes, lacrimation, blurred vision", "d": "SJ16(Tian You): eye pain, inability to see, lacrimation"}, "answer": "a", "category": "임상의학"}, {"id": 768, "question": "Dizziness, dry throat, wheezing, pasty-dry complexion, shortness of breath, and scanty phlegm in the throat that is difficult to expectorate with a dry cough. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Lung Phlegm Heat", "b": "Lung Heat", "c": "Lung Dryness", "d": "Lung Dry Phlegm"}, "answer": "d", "category": "해부생리"}, {"id": 769, "question": "Which of the following acupuncture points is located directly anterior and inferior to the free end of the eleventh rib?", "choices": {"a": "LR11", "b": "LR13", "c": "LR12", "d": "LR14"}, "answer": "b", "category": "침구학"}, {"id": 770, "question": "Which organ is known as the central pivot and controls the upward flow of pure fluids and downward flow of impure fluids?", "choices": {"a": "Small Intestines", "b": "Liver", "c": "Spleen", "d": "San Jiao"}, "answer": "c", "category": "기타"}, {"id": 771, "question": "Pale complexion, loose stools, weakness of limbs with a poor appetite, and slight abdominal distention after eating. Which of the following tongue and pulse presentations most accurately describes this case?", "choices": {"a": "Teethmarks, thick white coat; Slippery", "b": "Red body; Rapid", "c": "Pale body; Empty", "d": "Thin body; Weak"}, "answer": "c", "category": "기타"}, {"id": 772, "question": "Which herb can cause hypertension and/or edema when it is taken long term?", "choices": {"a": "Huang Qi(Astragali Membranacei, Radix)", "b": "Da Zao(Zizyphi Jujubae, Fructus)", "c": "Ren Shen(Ginseng, Radix)", "d": "Gan Cao(Glycyrrhizae Uralensis, Radix)"}, "answer": "d", "category": "본초학"}, {"id": 773, "question": "Which of the following is considered normal body temperature for an infant?", "choices": {"a": "98.6", "b": "98.4", "c": "98.2", "d": "98.8"}, "answer": "c", "category": "본초학"}, {"id": 774, "question": "A ‘Target Lesion’ can often be observed at the contraction of which disease?", "choices": {"a": "Lupus", "b": "Bacterial meningitis", "c": "Ecephalitis", "d": "Lyme's disease"}, "answer": "d", "category": "임상의학"}, {"id": 775, "question": "Blood and Fluids come from the same source and are mutually interchangeable. When Blood is thick, fluids go into the vessels and water down the Blood. Which organ governs Blood and is related to sweat?", "choices": {"a": "Small Intestine", "b": "Lung", "c": "Heart", "d": "Spleen"}, "answer": "c", "category": "기타"}, {"id": 776, "question": "Which herb is contraindicated for a person suffering from profuse sweating due to Qi Deficiency?", "choices": {"a": "Hou Po (Cx. Magnoliae Officinalis)", "b": "Huo Xiang (Hb. Agastaches seu Pogostemi)", "c": "Sha Ren (Fr. Amomi)", "d": "Cang Zhu (Rz. Atractylodis)"}, "answer": "d", "category": "본초학"}, {"id": 777, "question": "Which of the following single herbs moves Qi downward, reduces Phlegm, and calms wheezing for cough and wheezing?", "choices": {"a": "Cao Guo(Tsaoko Fructus)", "b": "Sha Ren(Amomi Fructus)", "c": "Hou Po(Magnoliae officinalis Cortex)", "d": "Huo Xiang(Pogostemonis Herba)"}, "answer": "c", "category": "본초학"}, {"id": 778, "question": "Which of the following Elements is associated with utmost Yang?", "choices": {"a": "Earth", "b": "Fire", "c": "Wood", "d": "Water"}, "answer": "b", "category": "기타"}, {"id": 779, "question": "Which of the following points does not belong to Five Window of Heaven/Sky points?", "choices": {"a": "BL10(Tian Zhu)", "b": "LI18(Fu Tu)", "c": "HT1(Ji Quan)", "d": "LU3(Tian Fu)"}, "answer": "c", "category": "기타"}, {"id": 780, "question": "Increased blood levels of ALT and AST typically indicate:", "choices": {"a": "Congestive heart failure", "b": "Liver disease", "c": "Renal disease", "d": "Pancreatitis"}, "answer": "b", "category": "해부생리"}, {"id": 781, "question": "Numbness of the limbs, tics and tremors, shaking of the head, a pale deviated tongue, and a hesitant pulse indicates:", "choices": {"a": "Liver Blood Deficiency", "b": "Wind due to Liver Yang rising", "c": "Liver Yin Deficiency", "d": "Wind due to Blood Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 782, "question": "Which of the following acupuncture points is located at the wrist joint, between the tendons of palmaris longus and flexor carpi radialis, level with HT7(Shen Men)?", "choices": {"a": "PC7(Da Ling)", "b": "PC8(Lao Gong)", "c": "PC5(Jian Shi)", "d": "PC6(Nei Guan)"}, "answer": "a", "category": "침구학"}, {"id": 783, "question": "Three days ago, an 18-year-old female patient began to suffer from photophobia, a subjective itchy sensation in the eyes, stabbing eye pain, a feeling as if she had gotten something caught in her eye, lacrimation, mild congestion of the conjunctiva, slightly swollen eyelids, headache, stuffy running nose, aversion to wind and cold, slight fever, red tongue, rapid pulse. What would be the outcome of your syndrome differentiation in this case?", "choices": {"a": "Wind-Heat with Lung meridian involvement", "b": "Invasion of the eyes by a Heat toxin transmitted from the Spleen and Lungs", "c": "Flaming up of Liver Fire", "d": "Hyperactivity of Liver Yang"}, "answer": "a", "category": "변증론"}, {"id": 784, "question": "Which three of the following physiologic activities are associated with the parasympathetic nervous system?", "choices": {"a": "Muscle building, erection, urination", "b": "Urination, urination block, ejaculation", "c": "Muscle breakdown, muscle building, erection", "d": "Erection, ejaculation, muscle building"}, "answer": "a", "category": "임상의학"}, {"id": 785, "question": "What is the exit point of the Kidney channel?", "choices": {"a": "KD19(Yin Du)", "b": "KD22(Bu Lang)", "c": "KD25(Shen Cang)", "d": "KD27(Shu Fu)"}, "answer": "d", "category": "침구학"}, {"id": 786, "question": "A 35-year-old female patient presents with chronic joint pain, muscle cramps, and stiffness. Imaging studies reveal early degeneration of the articular cartilage in her knees. Her physician suspects that a nutritional deficiency may be contributing to impaired cartilage maintenance and increased inflammation. Which of the following nutrient deficiencies is most likely involved?", "choices": {"a": "Magnesium", "b": "Iron", "c": "Vitamin C", "d": "Vitamin A"}, "answer": "a", "category": "해부생리"}, {"id": 787, "question": "A female has had a dry cough since her friend’s wedding. She suffers from shortness of breath, wheezing, and a dry throat. She tells you that there is sputum lodged in her throat that is scanty and difficult to expectorate. Her complexion seems dry and pasty. Which of the following differential diagnoses most accurately describes her signs and symptoms?", "choices": {"a": "Lung Phlegm Heat", "b": "Lung Dry Phlegm", "c": "Lung Cold Phlegm", "d": "Lung Phlegm Fluids"}, "answer": "b", "category": "해부생리"}, {"id": 788, "question": "For tonics and other formulas with rich, cloying substances which of the following recommendations is correct?", "choices": {"a": "Cook over a relatively low flame for 45-60 minutes", "b": "Always combine with Chen Pi(Citri reticulatae Pericarpium) or ground ginger", "c": "Cook over a high flame for a longer period nial Nerve II", "b": "Cranial Nerve III", "c": "Cranial Nerve IV", "d": "Cranial Nerve VI"}, "answer": "b", "category": "해부생리"}, {"id": 800, "question": "A 38 year old patient has had difficult bowel movements for 9 months with moist and thin stools. The pulse is deficient. What is the appropriate differentiation?", "choices": {"a": "Coldness Accumulation", "b": "Stomach Heat", "c": "Qi Stagnation", "d": "Qi Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 801, "question": "What is the main symptom to look for when trying to decide whether the patient has Taiyang Cold stroke or Wind stroke syndrome?", "choices": {"a": "Whether there is anhidrosis or hidrosis", "b": "Whether there is aversion to cold or to wind", "c": "Whether or not there is fever", "d": "Whether or not there is pain in the body"}, "answer": "a", "category": "기타"}, {"id": 802, "question": "A 19-year-old woman comes to you complaining of severe menstrual cramps, purple clots and thick blood, and periods which are frequently late. She says that the cramps are so severe she must spend three days a month in bed using a heating pad. You find out little else notable about her, other than that she is a vegetarian. The best diagnosis for this woman is?", "choices": {"a": "Liver Qi stagnation leading to Liver Blood Stasis", "b": "Internal Cold leading to Liver Blood Stasis", "c": "Spleen Qi deficiency leading to Liver Qi Stagnation", "d": "Insufficiency of Liver Blood"}, "answer": "b", "category": "변증론"}, {"id": 803, "question": "A patient has an upper respiratory tract infection. He has throat pain and unilateral ear pain. What are the most likely tongue and pulse?", "choices": {"a": "Normal tongue, red spots on the right side, thin white coating on the left side, string-", "b": "Normal tongue, thin white coating, superficial and tense pulse", "c": "Red tongue, very red on the sides, yellow coating, sting-taut and rapid pulse", "d": "Red and swollen in the front part of the tongue , yellow coating, rolling and rapid"}, "answer": "b", "category": "임상의학"}, {"id": 804, "question": "Digoxin is contraindicated with:", "choices": {"a": "Grapefruit juice", "b": "MAOIs", "c": "Bran cereals", "d": "SSRIs"}, "answer": "c", "category": "기타"}, {"id": 805, "question": "Which of the following points is a Mother-Tonification point, an Earth point, and a He-Sea point?", "choices": {"a": "LU5(Chi Ze)", "b": "LI11(Qu Chi)", "c": "SP9(Yin Ling Quan)", "d": "ST36(Zu San Li)"}, "answer": "b", "category": "기타"}, {"id": 806, "question": "All of the following are Sedating methods EXCEPT?", "choices": {"a": "Pointing the tip of the needle against the channel course", "b": "Lifting the needle forcefully and rapidly", "c": "Setting the mountain on fire", "d": "Pucture the skin rapidly"}, "answer": "c", "category": "임상의학"}, {"id": 807, "question": "Where are the muscle regions of 3 hand yang knotted at?", "choices": {"a": "The eyes", "b": "The angle of forehead", "c": "The genital region", "d": "The thoracic cavity"}, "answer": "b", "category": "해부생리"}, {"id": 808, "question": "How should Ren17(Tan Zhong) be needled?", "choices": {"a": "Puncture subcutaneously 0.2-0.3 inch", "b": "Puncture subcutaneously 0.3-0.5 inch", "c": "Puncture subcutaneously 1-1.5 inch", "d": "Puncture subcutaneously 0.5-1 inch"}, "answer": "b", "category": "임상의학"}, {"id": 809, "question": "Which of following statements is correct in terms of movement of Qi and Body Fluids?", "choices": {"a": "The Liver Qi goes upward and nourishes the eyes with tears", "b": "The Lung Qi flows down and regulates water metabolism through sweat", "c": "The Spleen Qi ascends to deliver the pure part of fluids to the space under the skin", "d": "The Heart Qi descends to the Bladder to vaporize the fluids to excrete urine"}, "answer": "b", "category": "임상의학"}, {"id": 810, "question": "Which type of Qi originates in the Kidneys?", "choices": {"a": "Zong Qi", "b": "Ying Qi", "c": "Gu Qi", "d": "Yuan Qi"}, "answer": "d", "category": "기타"}, idney", "c": "Clear Heat, moisten the Lung, and promote the production of body fluid to stop", "d": "Warm and tonify the Kidney Yang, Nourish Blood"}, "answer": "d", "category": "임상의학"}, {"id": 816, "question": "A 48 year old female patient has had persistent dizziness with a feeling of emptiness in the brain, tinnitus, sore back and knees, poor memory, pale tongue, deep weak pulse. What is the condition for this patient?", "choices": {"a": "Tinnitus due to hyperactivity of Liver Yang", "b": "Dizziness due to deficiency of Qi and Blood", "c": "Tinnitus due to kidney Yang deficiency", "d": "Dizziness due to kidney essence deficiency"}, "answer": "d", "category": "변증론"}, {"id": 817, "question": "Which of the following types of indirect moxibustion treats painful joints?", "choices": {"a": "Garlic", "b": "Ginger", "c": "Fu Zi (Monkshood)", "d": "Salt"}, "answer": "b", "category": "침구학"}, {"id": 818, "question": "A patient with a high BUN and creatinine level most likely has which conditon?", "choices": {"a": "Diabetes", "b": "Liver failure", "c": "Thalassemia", "d": "Kidney disease or kidney damage"}, "answer": "d", "category": "임상의학"}, {"id": 819, "question": "Which of following technique(s) is/are sedating method? I. Inserting the needle when the patient breathes in and withdrawing the needle when the patient breathes out II. Pointing the needle tip against the meridian course or direction III. Inserting the needle rapidly and withdrawing it slowly", "choices": {"a": "I only", "b": "I and II only", "c": "I and III only", "d": "I, II and III"}, "answer": "d", "category": "임상의학"}, {"id": 820, "question": "A young married couple are unable to conceive. The 27 year old husband has frequent desire for sex. He has no difficulty maintaining an erection. He can have sex for up to one hour, but is not able to ejaculate. he has spontaneous emission a few hours after sex. His other symptoms include restlessness, dark yellow urine, and dry mouth. he has a red face and blood tinged eyes. His tongue is red and his pulse is rapid and wiry. What is his diagnosis?", "choices": {"a": "Liver Fire Blazing", "b": "Liver Yang Rising", "c": "Damp-Heat Obstructing", "d": "Heart Phlegm Fire"}, "answer": "a", "category": "임상의학"}, {"id": 821, "question": "A patient has the following signs and symptoms: desire to cover up the body in spite of a feverish sensation, flushed face, thirst, desire for warm fluids, clear urinary output, and loose stools. The tongue is slightly purple with a moist white coating and the pulse is superficial and weak. This syndrome belongs to:", "choices": {"a": "True heat with false cold", "b": "True cold with false heat", "c": "Exterior heat and interior cold", "d": "Exterior cold and interior heat"}, "answer": "b", "category": "기타"}, {"id": 822, "question": "A 27 year old female complained of 'hoarseness' for over 6 months. At onset, she had a sore throat, a 'thickened' voice, cough and thirst. Spraying the throat with tincture of benzoin provided no relief, nor did warm, acrid herbs or cool, bitter herbs. She also complained of restlessness, disturbed sleep, tinnitus, a dry throat, and weakness and soreness in the lower back and in the knees. The hoarseness had caused her to speak with great difficulty. Her tongue was red with no coating, and the pulse was thready and rapid. What is the diagnosis for her at this time?", "choices": {"a": "Lung Yin deficiency", "b": "Kidney Yin deficiency with heat", "c": "Lung Qi deficiency", "d": "All of the above"}, "answer": "d", "category": "본초학"}, {"id": 823, "question": "Which of the following pairs of points is 2 cun apart?", "choices": {"a": "SJ5(Wai Guan) and SJ8(San Yang Luo)", "b": "LI8(Xia Lian) and LI9(Shang Lian)", "c": "LI5(Yang Xi) and LI6(Pian Li)", "d": "PC7(Da Ling) and PC5(Jian Shi)"}, "answer": "a", "category": "기타"}, {"id": 824, "question": "A 30-year-old female suffers from massive uterine bleeding, thin and light colored menstrual blood, loss of appetite, shortness of breath, and lack of spirit. Her complexion is pale. Her tongue is pale with thin white coat. Her·pulse is deficient. What would be the outcome of your syndrome differentiation in this case?", "choices": {"a": "Irregular menstruation due to Qi Stagnation", "b": "Metrorrhagia due to Deficient Spleen and Kidney", "c": "Metrorrhagia due to Blood Stasis", "d": "Failure of the Spleen to hold Blood within the vessels"}, "answer": "d", "category": "변증론"}, {"id": 825, "question": "What is the difference between Gou Teng (Ramulus cum Uncis Uncariae) and Tian Ma (Gastrodiae Rhizoma)?", "choices": {"a": "Gou Teng (Ramulus cum Uncis Uncariae) is better for transforming phlegm-", "b": "Gou Teng (Ramulus cum Uncis Uncariae) is better for clearing the liver heat", "c": "Gou Teng (Ramulus cum Uncis Uncariae) is more effective the Bi syndrome", "d": "Tian Ma (Gastrodiae Rhizoma) is better for releasing the exterior"}, "answer": "b", "category": "해부생리"}, {"id": 826, "question": "For which patients is electric acupuncture stimulation contraindicated?", "choices": {"a": "Patients with a cerebrovascular accident", "b": "Patients with cardiac bundle branch block", "c": "Patients with irritable bowel syndrome", "d": "Patients with cholecystitis"}, "answer": "b", "category": "임상의학"}, {"id": 827, "question": "Which scalp acupuncture area is found directly above the pupil of the eye, beginning at the hairline and extending 2 cm posteriorly?", "choices": {"a": "Thoracic cavity", "b": "Stomach", "c": "Reproductive", "d": "Liver and Gallbladder"}, "answer": "b", "category": "임상의학"}, {"id": 828, "question": "A blue color of the face indicates:", "choices": {"a": "Yang deficiency", "b": "Damp syndrome", "c": "Cold syndrome and blood loss", "d": "Cold syndrome, painful syndrome, stagnation of blood"}, "answer": "d", "category": "변증론"}, {"id": 829, "question": "Which herb should be added near the end of a decoction?", "choices": {"a": "Dai Zhe Shi (Haematitum)", "b": "Tian Hua Fen (Trichosanthis Radix)", "c": "Mu Xiang (Aucklandiae Radix)", "d": "Wu Yao (Linderae Radix)"}, "answer": "c", "category": "본초학"}, {"id": 830, "question": "Which of the following is NOT a sedating technique?", "choices": {"a": "Inserting the needle on the exhale", "b": "Withdrawing the needle slowly", "c": "Leaving the hole open on withdrawal", "d": "Rotating the needle forcefully in a counterclockwise direction"}, "answer": "a", "category": "임상의학"}, {"id": 831, "question": "A 42 year old male complained of incontinence of urine. His symptoms are: dribbling urination, distention and dull pain in the lower abdomen, purplish spots on the tongue, hesitant and rapid pulse. What would be the right treatment principle for this patient?", "choices": {"a": "Remove heat and promote diuresis", "b": "Warm the Mingmen Fire", "c": "Promote circulation of the Qi in the meridian, restore the function of UB.", "d": "Facilitate the passage of water and strengthen the Y uan Qi of Kidney"}, "answer": "c", "category": "임상의학"}, {"id": 832, "question": "Which type of the following treatments is best for the symptoms of diarrhea with abdominal pain, excessive sweating, cold limbs, and pale face?", "choices": {"a": "Moxibustion with ginger", "b": "Moxibustion with salt", "c": "Warm needle acupuncture", "d": "Moxibustion with garlic"}, "answer": "b", "category": "해부생리"}, {"id": 833, "question": "The Informed Consent must contain:", "choices": {"a": "All procedures that may be performed", "b": "All procedures that may be performed, the alternatives, risks, consequences", "c": "Only acupuncture related procedures and the patient signature, date", "d": "All procedures, alternatives, risks, consequences, patient signature, date"}, "answer": "d", "category": "해부생리"}, {"id": 834, "question": "The method of insertion for GB31(Feng Shi) is?", "choices": {"a": "Puncture perpendicularly 0.5-0.8 inch. Moxibustion is applicable.", "b": "Puncture perpendicularly 0.5-1.0 inch. Moxibustion is applicable.", "c": "Puncture perpendicularly 0.7-1.2 inch. Moxibustion is applicable.", "d": "Puncture perpendicularly 1.5-2.0 inch. Moxibustion is applicable."}, "answer": "c", "category": "침구학"}, {"id": 835, "question": "A rapid pulse is one that has more than how many beats per respiration cycle?", "choices": {"a": "3", "b": "4", "c": "5", "d": "6"}, "answer": "c", "category": "기타"}, {"id": 836, "question": "In CPR how do you check for infant responsiveness?", "choices": {"a": "Slapping his face lightly", "b": "Pinching facial skin", "c": "Patting his feet and shoulders", "d": "Sprinkling water on his face"}, "answer": "c", "category": "기타"}, {"id": 837, "question": "A patient experiencing myocardial infarction should be immediately referred to the ER. Which of the following is NOT a symptom of myocardial infarction?", "choices": {"a": "Severe headache", "b": "Chest pain, left arm or shoulder pain", "c": "Abnormal heartbeat with lightheadedness", "d": "Pallor and diaphoresis"}, "answer": "a", "category": "임상의학"}, {"id": 838, "question": "When using moxa, which of the following conditions does NOT require using special care or caution?", "choices": {"a": "Diabetes", "b": "Paralysis", "c": "Neural injury", "d": "Hypertension"}, "answer": "d", "category": "임상의학"}, {"id": 839, "question": "Health care personnel who have received the Hepatitis B Virus (HBV) vaccine:", "choices": {"a": "Also develop immunity to HIV", "b": "Develop immunity with no risk of HBV infection", "c": "Can still transmit the infection through sex", "d": "Need to receive a new vaccination every three years"}, "answer": "b", "category": "해부생리"}, {"id": 840, "question": "A 58-year-old man comes to the clinic with a chief complaint of seminal emission for 6 years. He states that it happens spontaneously even when he is awake. Other common symptoms include palpitations, restlessness, listlessness, lassitude, scanty yellow urine, dizziness, poor memory, insomnia, dry mouth, hot sensation in the five centers, and night sweating. His tongue and pulse is most likely?", "choices": {"a": "Pale tongue with thin white coating, and deficient pulse", "b": "Red tongue, yellow coating, and rapid pulse", "c": "Pale tongue with white coating and deep slower pulse", "d": "Red tongue with less coating, thready and rapid pulse"}, "answer": "d", "category": "기타"}, {"id": 841, "question": "Which of the following techniques is a reinforcing technique?", "choices": {"a": "Penetrating-heaven coolness", "b": "Inserting the needle rapidly and withdrawing it rapidly", "c": "Forceful lifting of the needle to the superficial region", "d": "Setting the mountain on fire"}, "answer": "d", "category": "기타"}, {"id": 842, "question": "Which type of cupping is described by the following: Clamp a cotton ball soaked in alcohol with some forceps, light the cotton on fire, put the flaming cotton in the cup, remove it and then place the cup on the patient.", "choices": {"a": "Fire throwing", "b": "Twinkling", "c": "Sparrow pecking", "d": "Wet cupping"}, "answer": "b", "category": "침구학"}, {"id": 843, "question": "What are the crossing meridians on the ST4(Di Cang)?", "choices": {"a": "Yang Qiao, Small Intestine", "b": "San Jiao, Large Intestine", "c": "Large Intestine, Small Intestine", "d": "Yang Qiao, Large Intestine"}, "answer": "d", "category": "원론/기초"}, {"id": 844, "question": "Which of the following is less related to the syndrome of rebellious Qi?", "choices": {"a": "Headache, dizziness", "b": "Coughing, asthmatic breathing", "c": "Hiccups, belching", "d": "Distension in the lower abdomen"}, "answer": "d", "category": "해부생리"}, {"id": 845, "question": "A 22 year old man has had diarrhea for the past year. When it started, he had fever and nausea. He was prescribed antibiotics, but they didn't help. Currently, he has frequent daily bowel movements with loose stools and cramping. The stools smell bad and he has an itchy anus. His tongue is red with a thick, yellow, wet coating; his pulse is slippery. How would you diagnose him?", "choices": {"a": "Gallbladder Damp Heat", "b": "Damp Heat in the Intestines", "c": "Liver Qi stagnation invading the Spleen", "d": "Stomach Fire"}, "answer": "b", "category": "변증론"}, {"id": 846, "question": "A 38 year old woman has depression. It started two weeks ago after an argument. At that time she had distention in the chest, nausea, and vomiting. The patient looks gloomy and has no desire for food and vomits clear fluid. Her complexion is pale and her tongue is normal with a thin white coat. Her pulse is wiry. What is her diagnosis?", "choices": {"a": "Stagnant Zhong Qi", "b": "Rebellious Stomach qi, deficient Heart blood", "c": "Deficient Spleen qi, rebellious Stomach qi, Liver fire", "d": "Stagnant Liver qi invading the Stomach"}, "answer": "d", "category": "임상의학"}, {"id": 847, "question": "Which of the following is a contraindication of Mu Dan Pi(Cortex Moutan Radicis)?", "choices": {"a": "Bruises due to traumatic injury", "b": "Amenorrhea, or purplish dark color of menstruation", "c": "Heat in the blood", "d": "Yin deficiency with excessive sweating"}, "answer": "d", "category": "변증론"}, {"id": 848, "question": "A patient has a sporadic cough which is productive with thick-white phlegm, shortness of breath, weak voice, tiredness, loose stools, and poor appetite. Which of the following actions would you take?", "choices": {"a": "Tonify Deficient Spleen and Lung Qi", "b": "Transform Phlegm first and then Tonify Deficient Spleen and Lung Qi", "c": "Tonify Deficient Spleen and Lung Qi and Transform Phlegm", "d": "Transform Phlegm"}, "answer": "c", "category": "임상의학"}, {"id": 849, "question": "At which one of the following points do the 3 Foot Yin meridians cross?", "choices": {"a": "Ren4(Guan Yuan)", "b": "Ren12(Zhong Wan)", "c": "Ren13(Shang Wan)", "d": "Ren10(Xia Wan)"}, "answer": "a", "category": "침구학"}, {"id": 850, "question": "Which flavor should be avoided in Lung disease?", "choices": {"a": "Sour", "b": "Bitter", "c": "Sweet", "d": "Salty"}, "answer": "b", "category": "해부생리"}, {"id": 851, "question": "A 27-year-old woman presents with abnormal uterine bleeding, characterized by an initial gush of blood followed by prolonged, light spotting. Her menstrual blood is pale and watery with few clots. She experiences chronic fatigue, orthostatic dizziness, and poor digestion with irregular bowel movements. Her periods are uncomfortable but not painful. What is the most likely diagnosis?", "choices": {"a": "Blood Deficiency with Blood Stagnation", "b": "Qi Deficiency with Blood Stagnation", "c": "Qi Deficiency not holding blood", "d": "Qi Deficiency with internal cold"}, "answer": "c", "category": "변증론"}, {"id": 852, "question": "Which of the following is outside the scope of an acupuncturist’s practice, according to the State of California?", "choices": {"a": "Teaching patients breathing techniques", "b": "Injecting diazepam with syringe needles on the acupuncture points", "c": "Treating patients with magnets", "d": "Suggesting dietary supplements to patients"}, "answer": "b", "category": "임상의학"}, {"id": 853, "question": "Long-term antibiotic use may cause a deficiency of ______?", "choices": {"a": "Vitamin A", "b": "Vitamin B2", "c": "Vitamin D", "d": "Vitamin K"}, "answer": "d", "category": "기타"}, {"id": 854, "question": "A 55 years of male patient complains of dull pain in the epigastrium after he had some cold drinks. His pain is relieved by pressure and warmth. Other symptoms include general lassitude, regurgitation of thin fluid, thin, white tongue coat, deep, slow pulse. What would be the right treatment principle for this patient?", "choices": {"a": "Warm the Middle Jiao, promote the distribution of Yang, relieve pain", "b": "Strengthen the function of Spleen, warm the Middle Jiao", "c": "Soothe Liver Qi, pacify Stomach, relieve pain", "d": "Warm the Middle Jiao, dispel Cold, regulate the flow of the Qi and relieve pain"}, "answer": "d", "category": "변증론"}, {"id": 855, "question": "Which kind of E-stim wave best treats chronic Bell’s Palsy?", "choices": {"a": "Dense", "b": "Dispersing", "c": "Dense and dispersing (Mixed)", "d": "Discontinuous"}, "answer": "c", "category": "기타"}, {"id": 856, "question": "A 62 year-old man has had head and neck pain for the past year. Additional symptoms include fullness in the chest and epigastrium, a fuzzy feeling in the head, dizziness and blurry vision. He has bleeding painful gums and bad breath. He likes to eat greasy-fried foods and smokes one pack of cigarettes per day. The tongue is red with sticky yellow coating. The pulse is slippery. What is the diagnosis?", "choices": {"a": "Retention of food transforming to fire", "b": "Spleen damp-heat", "c": "Stomach fire", "d": "Phlegm-heat obstructing the clear Yang; Stomach phlegm-fire"}, "answer": "d", "category": "해부생리"}, {"id": 857, "question": "According to the theory of the Five Elements, Kidney disease transmitting to the Spleen belongs to:", "choices": {"a": "The son affecting the mother", "b": "The mother affecting the son", "c": "Counteracting", "d": "Overacting"}, "answer": "c", "category": "원론/기초"}, {"id": 858, "question": "Which herb is in the category of Herbs that Stabilize and Bind?", "choices": {"a": "Suan Zao Ren (Sm. Zizyphi)", "b": "Wu Wei Zi (Fr. Schisandrae)", "c": "Tian Men Dong (R. Asparagi)", "d": "Dang Gui (Rx. Angelica Sinensis)"}, "answer": "b", "category": "본초학"}, {"id": 859, "question": "Which of the following special points is usually used for disorders of Zang, Fu organs, Qi, Blood, tendon, vessels?", "choices": {"a": "Eight-Confluent (extraordinary meridians) points", "b": "Eight-influential (meeting) points", "c": "Lower He-Sea points", "d": "Yuan points"}, "answer": "b", "category": "침구학"}, {"id": 860, "question": "A patient with a history of palpitations and chest depression on and off and for two years visited your office. He also has complained of vague chest pain, insomnia, fatigue, spontaneous sweating, night sweating, hot palms and soles, and shortness of breath. Physically he revealed a pale, lusterless face, red, flabby tongue with teeth marks, and a weak, thready, and slightly rapid pulse with skipping beats, about once every 15 to 20 beats. He most likely has been suffering from which condition?", "choices": {"a": "Qi and Yin deficiency of the chest", "b": "Exhaustion of Yang Qi of the Heart", "c": "Blood stasis of the Heart", "d": "None of the above"}, "answer": "a", "category": "변증론"}, {"id": 861, "question": "A 27-year-old male patient complains about nocturnal emissions that have occurred for the past month. He has the following additional symptoms: dizziness, palpitations, upset temperament, insomnia, disturbing dreams, dryness in the mouth and throat, lassitude and debility of the loins, red tongue and a rapid thin pulse. What would be the right treatment principle for this patient?", "choices": {"a": "Lower the HT fire and harmonize HT and KD", "b": "Tonify Heart and Kidney Yang", "c": "Nourish Liver and Kidney Yin", "d": "Strengthen Kidney and control the essence and seminal fluid"}, "answer": "a", "category": "변증론"}, {"id": 862, "question": "A 35 years old male patient went trip to Arizona 2 days ago. During his trip, He felt headache, dizziness, profuse sweating, hot sweating, hot skin, coarse breathing, dry mouth and tongue, dire thirst, superficial, large and rapid pulse. He had no signs of loss of consciousness. He seemed like he had a sunstroke. What is the condition of this patient?", "choices": {"a": "Sunstroke- superficial type", "b": "Sunstroke- severe type", "c": "Sunstroke- due to Wind-Heat", "d": "Sunstoke- due to Yin deficiency with hyperactivity of Fire"}, "answer": "a", "category": "변증론"}, {"id": 863, "question": "The three Yin Muscle regions of the foot connect with the:", "choices": {"a": "Angle of the forehead", "b": "Abdomen", "c": "Genital/pubic region", "d": "Hypochondriac region"}, "answer": "c", "category": "해부생리"}, {"id": 864, "question": "How do you remove the cup from the patient's body after you have finished the cupping treatment?", "choices": {"a": "Pull the cup off slowly", "b": "Hold the cup with one hand, and use the other hand to pull the cup off the skin", "c": "Hold the cup with one hand, and press the skin around the rim of the cup with the", "d": "Pull the cup off rapidly"}, "answer": "c", "category": "침구학"}, {"id": 865, "question": "A 53-year-old woman is experiencing hot flashes, night sweats, afternoon fever, hot sensations in her palms and soles, and bouts of anxiety. What foods would you recommend her to incorporate into her diet?", "choices": {"a": "Ginger tea, green onions, scallions, black pepper, cinnamon", "b": "Barley seed, kelp, red bean, mint tea, apples, dandelion", "c": "Yams, lotus seeds, spinach, black sesame, pear, watermelon, walnuts, banana,", "d": "Grapefruit, green tea, sweet basil, garlic"}, "answer": "c", "category": "기타"}, {"id": 866, "question": "The Jing-River point of the GB channel is located at?", "choices": {"a": "4 cun above the tip of the external malleolus, on the anterior border of the fibula", "b": "5 cun above the tip of the external malleolus, on the posterior border of the fibula", "c": "5 cun above the tip of the external malleolus, on the anterior border of the fibula", "d": "7 cun above the tip of the external malleolus, on the posterior border of the fibula"}, "answer": "a", "category": "침구학"}, {"id": 867, "question": "According to the Four Level Differentiation, the Ying (Nutritive) level disorder refers to disorder of which of the following organ(s)?", "choices": {"a": "Pericardium", "b": "Liver", "c": "Kidneys", "d": "Lungs"}, "answer": "a", "category": "기타"}, {"id": 868, "question": "An 8-year-old boy is suffering from intermittent pain in and around the umbilical region. The pain is worse when his stomach is empty and is relieved temporarily when he eats. His appetite, however, is poor, and he has become emaciated. There is a mass of what feels like tendons in his abdomen wh ate Kidney Yin", "c": "Expel Cold by warming the meridians and expelling the Damp Evil", "d": "Promote Blood circulation to remove Stagnant Blood and stop the pain"}, "answer": "a", "category": "변증론"}, {"id": 1008, "question": "Which of the following statements is NOT correct?", "choices": {"a": "Wood is associated with east, green, Spring, birth, sour, Liver, and Wind", "b": "Fire is associated with south, red, Summer, growth, bitter, Heart, and Fire", "c": "Metal is associated with west, white, Autumn, harvest, acrid/spicy, Lung, and", "d": "Water is associated with north, black, winter, storage, salty, Kidney, Damp"}, "answer": "d", "category": "해부생리"}, {"id": 1009, "question": "Which condition does redness on the bridge of the nose indicate?", "choices": {"a": "Damp Heat in the Spleen", "b": "Heat in Lungs", "c": "Liver Fire", "d": "Stomach Fire"}, "answer": "c", "category": "변증론"}, {"id": 1010, "question": "A 38-year-old woman complains of uterine bleeding. At the beginning of her period, there is \"flooding\" of blood which then stops and trickles long after the period is supposed to end. The blood does not have very much clots. The color is somewhat pale and watery. She is exhausted all the time, even with 10 hours of sleep. She gets severe dizziness, especially when she looks up or gets up too quickly. Her digestion has always been poor and she has trouble having a regular bowel movement every morning. She has some discomfort with her periods, but it is not painful. How will her tongue most likely present?", "choices": {"a": "Red tongue with purplish spot, thin yellowish coat", "b": "Red tongue, scanty coat", "c": "Pale tongue with purplish spots, thin white coat", "d": "Pale tongue, thin white coat"}, "answer": "d", "category": "기타"}, {"id": 1011, "question": "A 38-year-old woman complains of uterine bleeding. At the beginning of her period, there is \"flooding\" of blood which then stops and trickles long after the period is supposed to end. The blood does
