<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCE Practice Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --sky-blue: #87CEEB;
      --light-blue: #B0E0E6;
      --sky-tint: #E0F4FF;
      --cream: #E3F2FD;
      --warm-white: #F0F8FF;
      --text-dark: #4A4A4A;
      --text-light: #8B8B8B;
      --accent-blue: #5DADE2;
      --sage: #C8D5B9;
      --lavender: #E6D5F0;
    }
    
    body {
      font-family: 'Lato', -apple-system, sans-serif;
      background: #FDFCFA;
      background-image: 
        radial-gradient(circle at 20px 20px, rgba(135, 206, 235, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
      padding: 40px 20px 120px;
    }
    
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 60px;
      padding: 40px 0;
    }
    
    .header h1 {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--sky-blue);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .header p {
      font-size: 14px;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .card {
      background: rgba(227, 242, 253, 0.95);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 2px 20px rgba(135, 206, 235, 0.1);
      border: 1px solid rgba(135, 206, 235, 0.15);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 4px 30px rgba(135, 206, 235, 0.15);
      transform: translateY(-2px);
    }
    
    .menu-item {
      background: rgba(240, 248, 255, 0.9);
      background: rgba(227, 242, 253, 0.8);
      border: 2px solid var(--sky-tint);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .menu-item:hover {
      background: var(--sky-tint);
      border-color: var(--light-blue);
      transform: translateX(4px);
    }
    
    .menu-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--sky-tint), white);
    }
    
    .menu-content h3 {
      font-family: 'Crimson Text', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    
    .menu-content p {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 300;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    
    .stat-box {
      background: rgba(240, 248, 255, 0.9);
      text-align: center;
      padding: 20px;
      background: rgba(227, 242, 253, 0.8);
      border-radius: 12px;
      border: 1px solid var(--sky-tint);
    }
    
    .stat-number {
      font-family: 'Crimson Text', serif;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--sky-blue);
    }
    
    .stat-label {
      font-size: 11px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(135, 206, 235, 0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sky-blue), var(--light-blue));
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    
    .category-btn {
      background: rgba(240, 248, 255, 0.9);
      padding: 16px;
      background: rgba(227, 242, 253, 0.8);
      border: 2px solid transparent;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-dark);
    }
    
    .category-btn:hover {
      border-color: var(--sky-blue);
      background: var(--sky-tint);
      transform: scale(1.02);
    }
    
    .choice {
      background: rgba(240, 248, 255, 0.9);
      background: rgba(227, 242, 253, 0.8);
      border: 2px solid #E8E8E8;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .choice:hover {
      border-color: var(--sky-blue);
      background: rgba(227, 242, 253, 0.95);
    }
    
    .choice.selected {
      border-color: var(--sky-blue);
      background: var(--sky-tint);
    }
    
    .choice.correct {
      border-color: var(--sage);
      background: rgba(233, 245, 232, 0.9);
    }
    
    .choice.wrong {
      border-color: var(--accent-blue);
      background: rgba(255, 235, 238, 0.9);
    }
    
    .keyboard-hint {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--sky-tint);
      color: var(--sky-blue);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Lato', sans-serif;
      letter-spacing: 0.5px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--sky-blue), var(--light-blue));
      color: white;
      box-shadow: 0 4px 15px rgba(135, 206, 235, 0.3);
    }
    
    .btn-primary:hover {
      box-shadow: 0 6px 25px rgba(135, 206, 235, 0.4);
      transform: translateY(-1px);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .question-text {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 28px;
      white-space: pre-wrap;
      color: var(--text-dark);
    }
    
    .nav-buttons {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 248, 240, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-top: 1px solid rgba(135, 206, 235, 0.2);
      display: flex;
      gap: 12px;
      z-index: 1000;
    }
    
    .nav-btn {
      background: rgba(240, 248, 255, 0.9);
      flex: 1;
      padding: 14px;
      border: 2px solid var(--sky-tint);
      background: rgba(227, 242, 253, 0.8);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-dark);
      transition: all 0.3s ease;
    }
    
    .nav-btn:hover {
      background: var(--sky-tint);
      border-color: var(--sky-blue);
    }
    
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .section-title {
      font-family: 'Crimson Text', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--sky-blue);
      margin-bottom: 20px;
      text-align: center;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .card {
      animation: fadeIn 0.4s ease;
    }
    
    .progress-info {
      background: rgba(227, 242, 253, 0.8);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-light);
      border: 1px solid var(--sky-tint);
    }
    
    .progress-info strong {
      color: var(--sky-blue);
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>
  
  <script>
    const QUESTIONS = [{"id": 1, "question": "Which of the following herbs is cold and bitter?", "choices": {"a": "Long Dan Cao(Gentianae Radix)", "b": "Deng Xin Cao(Junci Medulla)", "c": "Gan Cao(Glycyrrhizae Radix)", "d": "Chen Pi(Citri reticulatae Pericarpium)"}, "answer": "a", "category": "본초학"}, {"id": 2, "question": "The organ(s) best represented by PSA levels is/are?", "choices": {"a": "Prostate", "b": "Penis", "c": "Bladder", "d": "Testis"}, "answer": "a", "category": "해부생리"}, {"id": 3, "question": "If you observe child abuse in a professional capacity, which of the following lengths of time do you have to file a written report to the police department?", "choices": {"a": "One business day", "b": "48 hours", "c": "36 hours", "d": "Two business days"}, "answer": "c", "category": "윤리/법규"}, {"id": 4, "question": "Upper part of abdominal reflex is controlled by?", "choices": {"a": "T8, T9", "b": "T5, T6", "c": "T10, T11", "d": "Vagus nerve"}, "answer": "a", "category": "해부생리"}, {"id": 5, "question": "You are needling the extra point Ding Chuan. You miss the point and need to re-needle the point. Which of the following methods is safest?", "choices": {"a": "Re-using the needle or using a new one are both recommended", "b": "Re-use the same needle", "c": "Use the.same needle but on the other side of the body", "d": "Dispose of the needle in the sharps container and use a new needle"}, "answer": "d", "category": "침구학"}, {"id": 6, "question": "Which of the following statements is incorrect about herbal dosage?", "choices": {"a": "Hard, heavy, moderate, and bland herbs use larger dose; light, toxic, and strong", "b": "The state of Stomach Qi should be considered when deciding dosage", "c": "The weak, elderly, and infants should take weaker and smaller dosages; those with", "d": "6-9 grams is a common dose; minerals are the heaviest doses at over 30 grams"}, "answer": "d", "category": "본초학"}, {"id": 7, "question": "A patient refuses to consent to a Tuina treatment. You know that it is the best treatment for his condition. Which of the following is not allowed?", "choices": {"a": "Treat him anyway, you are the expert", "b": "Perform Gua Sha instead with consent", "c": "Ask Ben if he agrees to an acupuncture treatment", "d": "Perform moving cups instead with consent"}, "answer": "a", "category": "침구학"}, {"id": 8, "question": "Which of the following colors enters the Lung, moistens and clears the Lung, eliminates Phlegm, regulates water, and stops cough?", "choices": {"a": "White", "b": "Red", "c": "Black", "d": "Yellow"}, "answer": "a", "category": "기타"}, {"id": 9, "question": "Mmnemonic for Suicide risk assessment, “SAD PERSONS” means: 1). S: Male sex; 2). A: Age (45 years); 3). D:____; 4). P: Previous attempt; 5). E: Excess alcohol or substance use; 6). R: Rational thinking loss; 7). S: Social supports lacking; 8). O: Organized plan; 9). N: No spouse; and 10). S: Sickness", "choices": {"a": "Depression", "b": "Down syndrome", "c": "Dementia", "d": "Dysthymia"}, "answer": "a", "category": "임상의학"}, {"id": 10, "question": "What is the incubation period of Hepatitis A?", "choices": {"a": "20-90 days", "b": "50-180 days", "c": "15-50 days", "d": "15-75 days"}, "answer": "c", "category": "임상의학"}, {"id": 11, "question": "Su Wen Chapter 1, ShangGu TianZhen Lun states that a female becomes \"strong in her extremities, her hair and tissues flourishing and her vital energy and blood becoming substantial\" at which age?", "choices": {"a": "14 years old", "b": "21 years old", "c": "28 years old", "d": "35 years old"}, "answer": "c", "category": "기타"}, {"id": 12, "question": "A patient in his 40s complains of chronic pain in the lumbar region that comes on slowly and subtly. The pain is aggravated by fatigue and alleviated by bed rest. His accompanying symptoms include coldness in the limbs, frequent urination at night, lassitude and weakness of the loins and knees, occasional nocturnal emissions, and a pale tongue. Which of the following descriptions most accurately characterizes this patient’s condition?", "choices": {"a": "Lower back pain due to Deficient Kidney Yin", "b": "Lower back pain due to Deficient Kidney Yang", "c": "Lower back pain due to Cold Damp Evil", "d": "Lower back pain due to Stagnant Blood"}, "answer": "b", "category": "변증론"}, {"id": 13, "question": "Charles has a distended epigastrium and feels like he is going to vomit. His breath is foul and he has sour regurgitation. He hasn’t had a bowel movement for a few days. He also Page 2 of 134 hasn’t been able to eat for the past few days. What would you expect the tongue and pulse to be for this case?", "choices": {"a": "Thick, yellow coat; Full, Slippery", "b": "Thick white coat; Slow and Deep", "c": "Pale, thin white coat; Weak and Empty", "d": "Purple; Wiry and Choppy"}, "answer": "a", "category": "해부생리"}, {"id": 14, "question": "Cough with expectoration of watery sputum, breathlessness, feeling of oppression in the chest, dizziness, cough elicited by fear, and vomiting of white sputum. Which of the following tongue and pulse presentations most accurately represents this case?", "choices": {"a": "Swollen body, sticky coat; Slippery", "b": "Pale body, no coat; Fine, Wiry", "c": "Thick, white, sticky coat; Soggy, Slippery or Wiry", "d": "Normal body, dry coat; Fine, Wiry"}, "answer": "c", "category": "임상의학"}, {"id": 15, "question": "Which of the following points treats hemorrhoids, benefits the two lower Yins, activates the channel, alleviates pain, and calms the Spirit?", "choices": {"a": "Du26(Shui Gou)", "b": "Du14(Da Zhui)", "c": "Du1(Chang Qiang)", "d": "Du3(Yao Yang Guan)"}, "answer": "c", "category": "임상의학"}, {"id": 16, "question": "In which of the following areas should sterilized items be placed on the clean field?", "choices": {"a": "Edges of the clean field", "b": "Center of the clean field", "c": "In a tray on the clean field but not on the clean field itself", "d": "Near the clean field but not on it"}, "answer": "b", "category": "윤리/법규"}, {"id": 17, "question": "Which of the following organs is the origin of Body Fluids?", "choices": {"a": "Stomach", "b": "Spleen", "c": "Kidney", "d": "Small Intestines"}, "answer": "a", "category": "기타"}, {"id": 18, "question": "Which is the guiding herb for occipital headache due to Wind-Cold attack?", "choices": {"a": "Chai Hu(Radix Bupleuri)", "b": "Qiang Huo(Rhizoma et Radix Notopterygii)", "c": "Xi Xin(Herba cum Radix Asari)", "d": "Huang Qin(Radix Scutellariae Baicalensis)"}, "answer": "b", "category": "본초학"}, {"id": 19, "question": "Which of the following acupuncture points is located on the dorsum of the hand, between the first and second metacarpal bones, at the midpoint of the second metacarpal bone and close to its radial border?", "choices": {"a": "LI14(Bi Nao)", "b": "LI11(Qu Chi)", "c": "LI3(San Jian)", "d": "LI4(He Gu)"}, "answer": "d", "category": "침구학"}, {"id": 20, "question": "Which of the following flavors clears and scatters and is used to expel pathogenic factors? Its side effect is that it may injure Yin.", "choices": {"a": "Bitter", "b": "Sweet", "c": "Salty", "d": "Pungent"}, "answer": "d", "category": "해부생리"}, {"id": 21, "question": "A patient presents with severe right lower quadrant pain, nausea and vomiting, and a fever of 101 degrees. Bowel sounds are evident in all four quadrants. Her WBC count is elevated, and she tests positive when you perform McBurney’s test. Your patient’s most likely diagnosis is:", "choices": {"a": "Appendicitis", "b": "Cholelithiasis", "c": "Irritable Bowel disease", "d": "Abdominal obstruction"}, "answer": "a", "category": "변증론"}, {"id": 22, "question": "Which of the following emotions causes epigastric discomfort, abdominal distention?", "choices": {"a": "Anger", "b": "Sadness", "c": "Pensiveness", "d": "Fear"}, "answer": "c", "category": "해부생리"}, {"id": 23, "question": "Which of the following herbs is bitter and cold?", "choices": {"a": "Zi Cao (Arnebiae/Lithospermi Radix)", "b": "Jin Yin Hua (Lonicerae Flos)", "c": "Zhi Zi (Gardeniae Fructus)", "d": "Lu Gen (Phragmitis Rhizoma)"}, "answer": "c", "category": "본초학"}, {"id": 24, "question": "Which of the taste below is related with Kidney organ in 5 element ?", "choices": {"a": "Sour", "b": "Salty", "c": "Bitter", "d": "Sweet"}, "answer": "b", "category": "해부생리"}, {"id": 25, "question": "Any object that pierces the skin must have which of the following qualities?", "choices": {"a": "Clean", "b": "Sterile", "c": "Disinfected", "d": "Washed with soap and water"}, "answer": "b", "category": "임상의학"}, {"id": 26, "question": "Which of the following divergent channels penetrates the tongue?", "choices": {"a": "Spleen", "b": "Kidney", "c": "Heart", "d": "Stomach"}, "answer": "a", "category": "원론/기초"}, {"id": 27, "question": "Which of the following acupuncture points are NOT contraindicated for moxibustion?", "choices": {"a": "ST1(Cheng Qi), ST2(Si Bai)", "b": "LI6(Pian Li), LI7(Wen Liu)", "c": "ST8(Tou Wei), ST9(Ren Ying)", "d": "LI19(He Liao),LI20(Ying Xiang)"}, "answer": "b", "category": "침구학"}, {"id": 28, "question": "Which of the following hormones are produced by the Anterior Pituitary gland?", "choices": {"a": "ACTH, LH, FSH, Melatonin", "b": "ADH, LH, FSH, TSH", "c": "ACTH, LH, FSH, TSH", "d": "ACTH, ADH, LH, FSH"}, "answer": "c", "category": "해부생리"}, {"id": 29, "question": "Which of the following herbs enters the Lung and Liver Channels?", "choices": {"a": "Sang Ye (Mori Folium)", "b": "Sheng Jiang Pí (Zingiberis Rhizomatis Cortex)", "c": "Xiang Ru (Moslae Herba)", "d": "Cang Er Zi (Xanthii Fructus)"}, "answer": "a", "category": "본초학"}, {"id": 30, "question": "Which of the following acupuncture points is located on the midline of the lower back, in the depression below the spinous process of the first lumbar vertebra?", "choices": {"a": "GV5(Xuan Zhui)", "b": "GV6(Ji Zhong)", "c": "GV4(Ming Men)", "d": "GV1(Zhang Qiang)"}, "answer": "a", "category": "침구학"}, {"id": 31, "question": "An attorney has asked you to give him your patient’s records. Which of the following documents must he present you with in order for you to release the medical files to him?", "choices": {"a": "An unofficial transcript from the patient", "b": "Subpoena", "c": "A detailed reason why", "d": "A written request from the attorney"}, "answer": "b", "category": "기타"}, {"id": 32, "question": "The generic names of cholesterol drugs typically end which suffix?", "choices": {"a": "statin", "b": "ol", "c": "done", "d": "pril"}, "answer": "a", "category": "기타"}, {"id": 33, "question": "After withdrawing a needle, which of the following protocols should be carried out?", "choices": {"a": "Placed on the clean field on the treatment table", "b": "Placed in a tray; once all have been removed, dispose of them in the sharps container", "c": "Handed to your assistant, who will place it in the sharps container", "d": "Immediately placed in the sharps container"}, "answer": "d", "category": "윤리/법규"}, {"id": 34, "question": "Which of the following acupuncture points is located on the dorsal aspect of the little finger, at the junction of lines drawn along the radial border of the nail and the base of the nail, approximately 0.1 cun from the corner of the nail?", "choices": {"a": "HT1(Shao Shang", "b": "HT2(Qian Gu)", "c": "HT8(Shao Fu)", "d": "HT9(Shao Chong)"}, "answer": "d", "category": "침구학"}, {"id": 35, "question": "Which season is Yang within Yin?", "choices": {"a": "Spring", "b": "Summer", "c": "Autumn", "d": "Winter"}, "answer": "a", "category": "기타"}, {"id": 36, "question": "Which of the following points regulates the Defensive Qi and adjusts sweating, expels Wind and releases the Exterior, regulates the face, eyes, nose, mouth and ears, activates the channel and alleviates pain, induces labor and also restores the Yang?", "choices": {"a": "LI4(He Gu)", "b": "LI20(Ying Xiang)", "c": "LI10(Shou San Li)", "d": "LI2(Er Jian)"}, "answer": "a", "category": "임상의학"}, {"id": 37, "question": "Which of the following herbs is NOT Anti-Parasitic?", "choices": {"a": "Bian Xu (Polygoni avicularis Herba)", "b": "Bai Bu (Stemonae Radix)", "c": "Bing Lang (Semen Arecae)", "d": "Bai He(Lilii Bulbus)"}, "answer": "d", "category": "본초학"}, {"id": 38, "question": "Which organ makes Blood through the marrow and essence?", "choices": {"a": "Spleen", "b": "Heart", "c": "Lung", "d": "Kidney"}, "answer": "d", "category": "기타"}, {"id": 39, "question": "Which of the following points activates the Channel and alleviates pain, clears Heat and reduces swelling, clears Damp Heat, and treats jaundice?", "choices": {"a": "SI4(Wan Gu)", "b": "SI19(Ting Gong)", "c": "SI1(Shao Ze)", "d": "SI13(Qu Yuan)"}, "answer": "a", "category": "변증론"}, {"id": 40, "question": "Which of the following herbs is acrid, warm, and toxic?", "choices": {"a": "Jie Geng(Platycodi Radix)", "b": "Bai Qian(Cynanchi stauntonii Rhizoma)", "c": "Ban Xia(Pinelliae Rhizoma preparatum)", "d": "Xuan Fu Hua(lnulae Flos)"}, "answer": "c", "category": "본초학"}, {"id": 41, "question": "Which of the following is correct about touching the acupuncture point before needling?", "choices": {"a": "The acupuncture point should not be touched prior to needling", "b": "The acupuncture point should only be touched with the other hand wearing a latex", "c": "The acupuncture point should be touched through a sterile cotton gauze", "d": "The acupuncture point can be touched after cleaning the skin"}, "answer": "d", "category": "침구학"}, {"id": 42, "question": "If a patient has painful eyes due to liver fire accompanied with constipation, which of the following herbs is the best to use? Page 4 of 134", "choices": {"a": "Jue Ming Zi(Cassia)", "b": "Bai Zhi(Angelica root)", "c": "Zhi Mu(Anemarrhena rhizome)", "d": "Zhi Zi(Gardenia)"}, "answer": "a", "category": "본초학"}, {"id": 43, "question": "Which of the following points treats torticollis and difficult neck rotation?", "choices": {"a": "Ex-Qian Zheng", "b": "Ex-Ba Xie", "c": "Ex-Luo Zhen", "d": "Ex-Si Feng ty of Fire"}, "answer": "b", "category": "임상의학"}, {"id": 225, "question": "A patient has fatigue in the morning, discomfort in the epigastrium, and empty pulse in the right middle positions. What is the treatment plan?", "choices": {"a": "Remove food retention; Stimulate Stomach descending function", "b": "Tonify and warm Stomach and Spleen Qi", "c": "Tonify Stomach Qi", "d": "Expel cold; Warm the Stomach; Stimulate Stomach descending function"}, "answer": "c", "category": "해부생리"}, {"id": 226, "question": "Patient suffers from chronic constipation with bowel movements only once every 3-5 days. She feels an urgent need to defecate but it requires great exertion to do so. She also experiences listlessness, shortness of breath on exertion, weakness of the limbs and spontaneous sweating. Her face, lips and fingernails are pale. What is the best pulse for this case?", "choices": {"a": "Thin, Weak and Tight", "b": "Thin and without Strength", "c": "Deep, Excess and Choppy", "d": "Slightly Floating, Thin and Soft"}, "answer": "b", "category": "기타"}, {"id": 227, "question": "Hiccups, nausea, belching, difficulty swallowing, and vomiting. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Stomach Qi Deficiency", "b": "Stomach Phlegm Heat", "c": "Stomach Qi Rebellion", "d": "Stomach Food Retention"}, "answer": "c", "category": "변증론"}, {"id": 228, "question": "Which of the following channels goes to the inner and outer canthus of the eye?", "choices": {"a": "Pericardium", "b": "San Jiao", "c": "Urinary Bladder", "d": "Small Intestine"}, "answer": "d", "category": "원론/기초"}, {"id": 229, "question": "Which of the following reaction times is typical for cupping reactions to resolve, including swelling, petechiae, ecchymosis, or persistent hyperpigmentation?", "choices": {"a": "1-2 days", "b": "Up to 1 weeks", "c": "3-5 days", "d": "A few days to 2 weeks"}, "answer": "d", "category": "침구학"}, {"id": 230, "question": "Patient has been seeing you for the past three years. She has chronic diarrhea, exhaustion and is always cold. Her legs are swollen at the end of the day and she has a lot of fluid around her abdomen. Her complexion is bright white. She has a dull pain in her abdomen that feels better with heat. For the last 10 days or so, she has had a cold which has now progressed to a bad cough. Her chest aches and she is breathless. Her face is red and she is thirsty. Her tongue is pale, wet at the root and red at the tip with a thick, yellow coat. Her pulse is Overflowing, Rapid in the right front position and Deep and Slow on both chi positions. What is the diagnosis for this case?", "choices": {"a": "Kidney Yang Deficiency Water Overflowing with Phlegm Heat in the Lungs", "b": "Spleen and Kidney Yang Deficiency with Damp Accumulation with Lung Heat", "c": "Heat Above and Cold Below", "d": "Spleen and Kidney Yang Deficiency with Lung Cold Phlegm"}, "answer": "c", "category": "변증론"}, {"id": 231, "question": "Which of the following acupuncture points is located above the ankle joint, 3 cun superior to the prominence of the lateral malleolus, between the posterior border of the fibula and the tendons of peroneus longus and brevis(from A Manual of Acupuncture)?", "choices": {"a": "ST39", "b": "GB38", "c": "ST38", "d": "GB39"}, "answer": "d", "category": "침구학"}, {"id": 232, "question": "Which of the following acupuncture points is located on the radial side of the tendon of flexor carpi ulnaris, 1 cun proximal to HT7?", "choices": {"a": "HT4(Ling Dao)", "b": "LU8(Jing Qu)", "c": "HT5(Tong Li)", "d": "LU7(Lie Que)"}, "answer": "c", "category": "침구학"}, {"id": 233, "question": "What point tonifies the Spleen, builds Qi and Blood, resolves Phlegm, treats deficiency type diarrhea?", "choices": {"a": "UB21(Wei Shu)", "b": "UB20(Pi Shu)", "c": "UB22(San Jiao Shu)", "d": "UB18(Gan Shu)"}, "answer": "b", "category": "기타"}, {"id": 234, "question": "Dizziness, insomnia, dream-disturbed sleep, poor memory, anxiety, propensity to be startled, palpitations, dull-pale complexion, fatigue, muscle weakness, and scanty periods. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Red body, no coat; Rapid, Choppy", "b": "Pale and thin body; Choppy, Fine", "c": "Pale body, thin yellow coat; Fine, Rapid", "d": "Pale body, greasy coat; Fine, Slippery"}, "answer": "b", "category": "해부생리"}, {"id": 235, "question": "Where is the area of scalp acupuncture that can treat loss of balance due to cerebellar disorder?", "choices": {"a": "3cm, lateral to external occipital protuberance, parallel to midline of head, 4cm in", "b": "Midway between and parallel with Stomach area and the midline of head, bilaterally,", "c": "A line 2cm in length extending anteriorly from the stomach area.", "d": "Vertical line 2cm beside tuber parietale on back of head, 3cm in length."}, "answer": "a", "category": "임상의학"}, {"id": 236, "question": "Which of the following acupuncture points is located on the radial side of the wrist, in the center of the hollow formed by the tendons of extensor pollicis longus and brevis (anatomical snuffbox)?", "choices": {"a": "SI6", "b": "LI5", "c": "TE4", "d": "SI5"}, "answer": "b", "category": "침구학"}, {"id": 237, "question": "Which of the following methods is most effective at reducing toxicity and the side effects of herbs?", "choices": {"a": "Water soak", "b": "Dry-Frying", "c": "Calcining", "d": "Roasting in Ashes"}, "answer": "d", "category": "본초학"}, {"id": 238, "question": "Which of the following Elements has the basic qualities of sowing, growing, and reaping? It is interpreted as nutrition. Its movement is center and stability.", "choices": {"a": "Fire", "b": "Earth", "c": "Metal", "d": "Wood"}, "answer": "b", "category": "기타"}, {"id": 239, "question": "Which of the following flavors travels with Qi and should not be used when the Qi is diseased?", "choices": {"a": "Bitter", "b": "Sweet", "c": "Sour", "d": "Acrid/Pungent"}, "answer": "d", "category": "본초학"}, {"id": 240, "question": "Which of the following acupuncture points is located on the lower leg, midway between the tibiofemoral joint line (level with the popliteal crease) and the lateral malleolus, two finger-breadths lateral to the anterior crest of the tibia (i.e. one finger-breadth lateral to ST38)?", "choices": {"a": "GB35", "b": "ST40", "c": "ST39", "d": "GB34"}, "answer": "b", "category": "침구학"}, {"id": 241, "question": "SI17(Tian Rong) is at which of the following locations on the body?", "choices": {"a": "Between the sternal head and the clavicular heads of the SCM", "b": "Below the eye in the depression on the lower border of the zygoma", "c": "Posterior border of the SCM", "d": "Anterior border of the SCM"}, "answer": "d", "category": "임상의학"}, {"id": 242, "question": "Which herb has the function of Clearing Damp-Heat in the Stomach and Heat in the Lungs?", "choices": {"a": "Huang Lian(Rx. Coptisis)", "b": "Huang Qin(Rx. Scutellariae)", "c": "Huang Bai(Cx. Phellodendri)", "d": "Ku Shen(Rx. Sophorae Flavescentis)"}, "answer": "b", "category": "본초학"}, {"id": 243, "question": "Which of the following Five Element sequences is responsible for generating or promoting?", "choices": {"a": "Ke", "b": "Sheng", "c": "Wu", "d": "Cheng"}, "answer": "b", "category": "원론/기초"}, {"id": 244, "question": "Which of the following herbs travel to the Leg Jue Yin channel?", "choices": {"a": "Lian Qiao(Fructus Forsythiae Suspensae) and Bai Zhi(Angelicae dahuricae Radix)", "b": "Jie Geng(Platycodi Radix), and Sheng Ma(Cimicifugae Rhizoma)", "c": "Chuan Xiong(Chuanxiong Rhizoma), and Chai Hu(Bupleuri Radix)", "d": "Shi Gao(Gypsum fibrosum), and Ge Gen(Puerariae Radix)"}, "answer": "c", "category": "본초학"}, {"id": 245, "question": "Which of the following acupuncture points is a group of 4 points at the vertex, and 1 cun respectively posterior, anterior, and lateral to GV20(Bai Hui)?", "choices": {"a": "Ba Feng", "b": "Ba Xie", "c": "Si Sheng Cong", "d": "Si Feng"}, "answer": "c", "category": "침구학"}, {"id": 246, "question": "Which of the following acupuncture points is located on the ulnar border of the little finger, in a depression just distal to the metacarpo-phalangeal joint?", "choices": {"a": "SI18(Quan Liao)", "b": "SI3(Hou Xi)", "c": "SI2(Qian Gu)", "d": "SI17(Tian Rong)"}, "answer": "c", "category": "침구학"}, {"id": 247, "question": "How should a needle stick from a needle used to treat a patient with a viral infectious disease be handled?", "choices": {"a": "Wait to see if symptoms manifest", "b": "Request antibiotic therapy", "c": "Get immediate medical advice", "d": "Report to the local authorities"}, "answer": "c", "category": "임상의학"}, {"id": 248, "question": "Cough with expectoration of watery sputum, breathlessness, feeling of oppression in the chest, dizziness, cough elicited by fear, and vomiting of white sputum. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Lung Heat Phlegm", "b": "Lung Phlegm Fluids", "c": "Lung Cold Phlegm", "d": "Lung Wind Water"}, "answer": "b", "category": "임상의학"}, {"id": 249, "question": "Which of the following new techniques is used in conjunction with mammography specifically because it is very sensitive and specific in evaluating the female breast?", "choices": {"a": "X-ray", "b": "Ultrasonography", "c": "Self-exam", "d": "MRI"}, "answer": "d", "category": "해부생리"}, {"id": 250, "question": "Deafness, poor memory, loose teeth, lack of libido, infertility, sterility, primary amenorrhea, weakness of the legs and knees, osteomalacia, absentmindedness, and late closure of fontanel in toddler. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Red body, thick white coat; Leather, Weak (both rear positions)", "b": "Normal body, thin white coat; Floating, Empty, Leather", "c": "Pale body, no coat; Floating, Empty, Leather", "d": "Pale body, greasy coat; Empty, Leather, Deep, Slow"}, "answer": "c", "category": "기타"}, {"id": 251, "question": "Which of the following organs regulates the water passages?", "choices": {"a": "Lung", "b": "San Jiao", "c": "Spleen", "d": "Kidney"}, "answer": "a", "category": "기타"}, {"id": 252, "question": "A patient has dry stools, a burning sensation in the anus, and a thick dry yellow tongue coat. How would you treat her?", "choices": {"a": "Clear heat in the Stomach and Large Intestine, promote bowel movement", "b": "Promote fluids in the Large Intestine", "c": "Clear heat", "d": "Clear heat in the Large Intestine and Stomach, promote body fluids"}, "answer": "d", "category": "기타"}, {"id": 253, "question": "Which of the following herbs is least appropriate for diarrhea from weak Spleen and Stomach?", "choices": {"a": "Rou Cong Rong(Cistanches Deserticolae)", "b": "Ba Ji Tian(Rx. Morindae Officialis)", "c": "Yin Yang Huo(Hb. Epimedii)", "d": "Yi Zhi Ren(Fr. Alpiniae Oxyphyllae)"}, "answer": "a", "category": "본초학"}, {"id": 254, "question": "Which of the following affects the function of the Liver in maintaining the free flow of Qi?", "choices": {"a": "Emotional activity", "b": "Ascending and descending function of the stomach and spleen", "c": "Secretion of bile", "d": "All of the above"}, "answer": "d", "category": "임상의학"}, {"id": 255, "question": "Which of the following eight-principle treatment methods resolves accumulation, treats stroke, poisoning, overeating, paralysis, and Phlegm accumulations in the pharynx and pharyngeal?", "choices": {"a": "V omiting", "b": "Purging", "c": "Sweating", "d": "Reducing"}, "answer": "a", "category": "기타"}, {"id": 256, "question": "A purple tongue always indicates:", "choices": {"a": "Excess cold", "b": "Yang deficiency", "c": "Excess heat", "d": "Blood stasis"}, "answer": "d", "category": "변증론"}, {"id": 257, "question": "Severe abdominal pain and/or distention with a dislike of pressure, constipation, borborygmi, flatulence, and vomiting. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Small Intestine Deficiency Cold", "b": "Small Intestine Worms", "c": "Small Intestine Qi Tied", "d": "Small Intestine Damp Heat"}, "answer": "c", "category": "변증론"}, {"id": 258, "question": "Which of the following Elements is associated with the scorched/burnt smell?", "choices": {"a": "Earth", "b": "Metal", "c": "Water", "d": "Fire"}, "answer": "d", "category": "기타"}, {"id": 259, "question": "A patient suffers from distending pain in the chest and hypochondriac areas, bitter taste in the mouth, dry throat, dream disturbed sleep, and irritability. Which of the following herbs makes the classic combination with Huang Qin(Radix Scutellariae Baicalensis) to treat this pattern?", "choices": {"a": "Xiang Fu(Rhizoma Cyperi Rotundi)", "b": "Chai Hu(Radix Bupleuri)", "c": "Qing Pi(Pericarpium Citri Reticulatae Viride)", "d": "Chuan Lian Zi(Fructus Meliae Toosendan)"}, "answer": "b", "category": "본초학"}, {"id": 260, "question": "Which of the following channels cross at SI18(Quan Liao)?", "choices": {"a": "Small Intestine and Triple Energizer", "b": "Small Intestine, Urinary Bladder, Yang Wei, and Yang Qiao", "c": "Small Intestine, Triple Energizer, and Gallbladder", "d": "Small Intestine, Large Intestine, Triple Energizer, and Gallbladder"}, "answer": "a", "category": "원론/기초"}, {"id": 261, "question": "The work surface used for the clean field should be cleaned at least once daily using which of the following types of cleaners?", "choices": {"a": "Glutaraldehyde", "b": "High level disinfectants", "c": "Low level disinfectants", "d": "Household bleach"}, "answer": "c", "category": "해부생리"}, {"id": 262, "question": "A six-year-old female patient has had a weakened body all of her life.  For the last three days she has had no appetite, suffered from eructation and vomiting of acid, and has Page 20 of 134 passed a large quantity of foul-smelling feces that are not loose. Her abdomen is swollen. Her tongue is reddish with white greasy fur and her pulse is Slippery. Which of the following diagnoses most accurately represents this patient’s condition?", "choices": {"a": "Blended Evils of Damp and Heat that have stagnated within the body", "b": "Yang Deficiency of the organs", "c": "Stagnation caused by diet", "d": "Diseases caused by an exogenous pathogen"}, "answer": "c", "category": "변증론"}, {"id": 263, "question": "Which of the following acupuncture points is located on the midline at the base of the neck, in the depression below the spinous process of the seventh cervical vertebra?", "choices": {"a": "GV10(Ling Tai)", "b": "GV14(Da Zhui)", "c": "SI14(Jian Wai Shu)", "d": "TE16(Tian Y u)"}, "answer": "b", "category": "침구학"}, {"id": 264, "question": "Which organ participates in the final transformation of Qi through the catalytic actions of Y uan Qi which transforms Zong Qi into Zhen Qi?", "choices": {"a": "Spleen", "b": "Liver", "c": "Kidney", "d": "Stomach"}, "answer": "c", "category": "임상의학"}, {"id": 265, "question": "Which herb must be cautiously used in pregnancy?", "choices": {"a": "Bai Ji Li(Fructus Tribuli Terrestris)", "b": "Gui Zhi(Cinnamomi Ramulus)", "c": "Hou Po(Magnoliae Flos)", "d": "All of above"}, "answer": "d", "category": "본초학"}, {"id": 266, "question": "Which of the following colors enters the Middle Jiao, benefits the Qi, detoxifies and reduces inflammation, and clears Heat?", "choices": {"a": "Green", "b": "Yellow", "c": "White", "d": "Red"}, "answer": "b", "category": "기타"}, {"id": 267, "question": "Christopher complains of hypochondriac distention for three weeks. He feels angry, tired, and depressed. His sleep is poor. He does not wish to eat food and complains that everything tastes bitter, even sweet food. He has redness in his eyes. Which of the following tongue and pulse presentations most closely apply to this case?", "choices": {"a": "Dry, yellow tongue coat; Hesitant and Rapid pulse", "b": "Red tongue with a thick white coat; Rolling and String-Taut pulse", "c": "Pale tongue with teethmarks; Thready pulse", "d": "Yellow tongue coat on the left; Rolling and String-Taut pulse"}, "answer": "d", "category": "해부생리"}, {"id": 268, "question": "Which of the following Elements is associated with storage?", "choices": {"a": "Earth", "b": "Fire", "c": "Water", "d": "Metal"}, "answer": "c", "category": "기타"}, {"id": 269, "question": "You are getting ready to needle your patient. You have washed your hands. The clean field is prepared. The skin is swabbed with alcohol and the alcohol has dried. As you go to insert your first needle, your hair falls in front of your eyes. You push the hair behind your ear and then take which of the following actions?", "choices": {"a": "Tie your hair back in a ponytail", "b": "Rewash your hands", "c": "Palpate the patient’s skin before inserting the needle", "d": "Insert the needle into the first point"}, "answer": "b", "category": "임상의학"}, {"id": 270, "question": "Cold feeling in the legs and back, cold hands, scanty/clear urination, soreness of the lower back, breathlessness, and edema of the ankles and legs. Which of the following tongue and pulse presentations most accurately represents this case?", "choices": {"a": "Pale, swollen body, wet with white coat; Deep, Weak, Slow", "b": "Red/swollen body, wet/dry coat; Deep, Weak, slightly Rapid", "c": "Pale body, thick white coat; Deep, Weak, Slippery", "d": "Red body, no coat; Rapid, Weak, Deep"}, "answer": "a", "category": "기타"}, {"id": 271, "question": "Which of the following herbs is sweet and neutral when unprepared and sweet and warm when dry-fried?", "choices": {"a": "Xian Mao(Curculiginis Rhizoma)", "b": "Gan Cao(Glycyrrhizae Radix)", "c": "Gu Sui Bu(Drynariae Rhizoma)", "d": "Rou Cong Rong(Cistanches Herba)"}, "answer": "b", "category": "본초학"}, {"id": 272, "question": "A slippery pulse indicates all of the following EXCEPT?", "choices": {"a": "Pain", "b": "Pregnancy", "c": "Phlegm", "d": "Food retention"}, "answer": "a", "category": "기타"}, {"id": 273, "question": "What is the most important difference between Yangming meridian syndrome and Yangming organ syndrome?", "choices": {"a": "Whether or not there is excessive internal Heat", "b": "Whether there is anhidrosis or hidrosis", "c": "Whether or not the patient has dry stool in the intestines", "d": "Whether or not the patient has a flushed face and upset temperament"}, "answer": "c", "category": "원론/기초"}, {"id": 274, "question": "In ear acupuncture, where is the location of the uterus?", "choices": {"a": "At the base of cavum conchae", "b": "On the antitragus, medial to the stop wheezing point", "c": "On the superior part of the inner wall of the antitragus", "d": "Slightly above the parting of the two crus of the antihelix, in the triangular fossa"}, "answer": "d", "category": "임상의학"}, {"id": 275, "question": "Which of the following conditions is the leading cause of blindness in the United States?", "choices": {"a": "Open-angle glaucoma", "b": "Night blindness", "c": "Diabetic retinopathy", "d": "Closed-angle glaucoma"}, "answer": "c", "category": "기타"}, {"id": 276, "question": "This nerve innervates the digestive tract and is responsible for activating the \"rest and digest\" response:", "choices": {"a": "The sympathetic chain ganglia", "b": "The vagus nerve", "c": "The phrenic nerve", "d": "Dorsal root ganglia"}, "answer": "b", "category": "해부생리"}, {"id": 277, "question": "When performing acupuncture, the practitioner is manipulating which Qi?", "choices": {"a": "Ying Qi(Nutritive Qi)", "b": "Yuan Qi(Original Qi)", "c": "Zhen Qi(Vital/True/Meridian Qi)", "d": "Wei Qi(Defensive Qi)"}, "answer": "a", "category": "임상의학"}, {"id": 278, "question": "A 27-year-old male patient complains about nocturnal emissions that have occurred for the past month. He has the following accompanying symptoms: dizziness, palpitations, upset temperament, insomnia, disturbing dreams, dryness in the mouth and throat, lassitude and debility of the loins, red tongue and a Thin pulse.  Which of the following treatment methods is most suitable for this case?", "choices": {"a": "Nourish the Yin to lower the Fire Evil, keep the Heart Fire and Kidney Water in", "b": "Warm and recuperate the Heart and Kidney", "c": "Reinforce the Kidney Qi", "d": "Nourish and invigorate the Kidney and Liver"}, "answer": "a", "category": "변증론"}, {"id": 279, "question": "Which of the following acupuncture points is located on the dorsal aspect of the index finger, at the junction of lines drawn along the radial border of the nail and the base of the nail, approximately 0.1 cun from the corner of the nail?", "choices": {"a": "LI20", "b": "LI2", "c": "LI1", "d": "LI11"}, "answer": "c", "category": "침구학"}, {"id": 280, "question": "A male comes in with hypochondrial fullness and distension. His complexion looks yellow, as do his sclera. He is very nauseous and feels like vomiting often. He’s also thirsty but doesn’t want to drink, even though there is a bitter taste in his mouth. He is often dizzy and has a ringing in his ears. He has difficulty regulating his temperature, and is often putting on layers because he feels chilled or taking them all off because he’s too hot. His feet are swollen and he has a strange skin rash in his genital region that is very itchy. Which of the following differential diagnoses most accurately describes his condition?", "choices": {"a": "Gallbladder Damp Heat", "b": "Spleen Damp Heat", "c": "Gallbladder Damp", "d": "Gallbladder and Liver Damp Heat"}, "answer": "d", "category": "변증론"}, {"id": 281, "question": "A patient comes into your office early in the morning, and reports having experienced severe abdominal pain last night a few hours after dinner, and it has lasted more than 6 hours. What do you suggest?", "choices": {"a": "The patient should drink milk of magnesia", "b": "Ask the patient if they had breakfast, to make sure these are not the side of effects of", "c": "Have the patient transported to the hospital", "d": "Tell the patient they should make an appointment with their medical doctor"}, "answer": "c", "category": "해부생리"}, {"id": 282, "question": "Which of the following two modalities should be avoided 48 hours before and 24 hours after chemotherapy sessions?", "choices": {"a": "Estim and gua sha", "b": "Cupping and gua sha", "c": "Acupuncture and scalp acupuncture", "d": "Ear Acupuncture and moxa"}, "answer": "b", "category": "임상의학"}, {"id": 283, "question": "Patient wakes up every morning with a bitter taste in his mouth, and it is especially worse if his sleep is bad. He never really sleeps well, and he feels very restless and it’s hard for him to concentrate on any one thing. His face looks red. His urine appears dark and sometimes has a little blood in it. His tongue is red with red thorns and a thick, yellow coat. There is a crack that runs the length of his tongue to its tip. The pulse is Full, Rapid and Hasty. What is the best diagnosis for this case?", "choices": {"a": "Liver Fire", "b": "Stomach Phlegm Fire", "c": "Kidney Yin Deficiency Fire Blazing", "d": "Heart Fire Blazing"}, "answer": "d", "category": "변증론"}, {"id": 284, "question": "Which of the following acupuncture points is located on the radial side of the forearm, 2 cun distal to Ll11, on the line connecting LI11 with LI5?", "choices": {"a": "TE10", "b": "LI10", "c": "LI8", "d": "SI8"}, "answer": "b", "category": "침구학"}, {"id": 285, "question": "Which of the following herbs is sweet, bitter, and cold?", "choices": {"a": "Mu Zei (Equiseti hiemalis Herba)", "b": "Sang Ye (Mori Folium)", "c": "Dan Dou Chi (Sojae Semen preparatum)", "d": "Ju Hua (Chrysanthemi Flos)"}, "answer": "b", "category": "본초학"}, {"id": 286, "question": "A male comes in complaining of feeling really feverish at night. His speech is incoherent and he tells you, as best as he can, that his body feels hot but that his hands and feet are cold. Which of the following tongue and pulse presentations would you expect this patient to have given his signs and symptoms ollowing classification of drugs contain the suffix of “-olol?”", "choices": {"a": "Calcium channel blockers", "b": "ACE Inhibitors", "c": "Beta blockers", "d": "HMG-CoA reductase inhibitors"}, "answer": "c", "category": "임상의학"}, {"id": 401, "question": "Which of the following is NOT a true function of the Spleen?", "choices": {"a": "It controls the blood vessels", "b": "It opens into the mouth and manifests in the lips", "c": "It governs transformation and transportation", "d": "It controls the muscles and the four limbs"}, "answer": "a", "category": "임상의학"}, {"id": 402, "question": "Which of the following acupuncture points is located 3 cun lateral to the lower border of the spinous process of T1?", "choices": {"a": "GB21(Jian Jing)", "b": "TE15(Tian Liao)", "c": "SI15(Jian Zhong Shu)", "d": "SI14(Jian Wai Shu)"}, "answer": "d", "category": "침구학"}, {"id": 403, "question": "Which of the following herbs enters the Bladder, Heart, and Small Intestine Channels?", "choices": {"a": "Mu Tong(Akebiae Caulis)", "b": "Hua Shi(Talcum)", "c": "Che Qian Zi(Plantaginis Semen)", "d": "Yi Yi Ren(Coicis Semen)"}, "answer": "a", "category": "본초학"}, {"id": 404, "question": "What are the most likely causes of abnormal uterine bleeding in post-menopausal women?", "choices": {"a": "Uterine cancer", "b": "Vulvulitis", "c": "Pelvic inflammatory disease", "d": "Vaginitis"}, "answer": "a", "category": "기타"}, {"id": 405, "question": "What is the distance between the He Sea point of the Foot Yangming and the Lower He Sea point of the Hand Yangming?", "choices": {"a": "6 cun", "b": "2 cun", "c": "3 cun", "d": "5 cun"}, "answer": "c", "category": "기타"}, {"id": 406, "question": "Which of the following conditions can be characterized by right lower quadrant abdominal pain, fever, nausea, vomiting, constipation, and an increase in WBC count?", "choices": {"a": "Appendicitis", "b": "Rectal prolapse", "c": "Cholecystitis", "d": "Irritable bowel syndrome"}, "answer": "a", "category": "임상의학"}, {"id": ", "category": "해부생리"}, {"id": 411, "question": "Which of the following acupuncture points is located on the dorsal aspect of the second toe, at the junction of lines drawn along the lateral border of the nail and the base of the nail, approximately 0.1 cun from the corner of the nail?", "choices": {"a": "ST44(Nei Ting)", "b": "ST45(Li Dui)", "c": "ST1(Cheng Qi)", "d": "ST2(Si Bai)"}, "answer": "b", "category": "침구학"}, {"id": 412, "question": "Which of the following statements about multiple sclerosis is not true?", "choices": {"a": "An electrical sensation down the back with neck flexion is often a symptom", "b": "It may cause increased sensitivity to temperature changes", "c": "It typically affects men more frequently than women", "d": "Its first sign is often unilaterally blurred vision"}, "answer": "c", "category": "임상의학"}, {"id": 413, "question": "Over the past year, a 55-year-old male has suffered from a feeling of oppression in the chest. This is accompanied by palpitations and shortness of breath that becomes more aggravated after movement and relieved with relaxation. He has a pale complexion, suffers from insomnia, and is often anxious. He is listless, easily fatigued, and suffers from spontaneous perspiration. The tongue has a white coat, and the pulse is Thready and Weak. What is the differential diagnosis for this patient?", "choices": {"a": "Deficiency of Heart Qi", "b": "A combined Deficiency of Heart Blood and Heart Qi", "c": "Deficiency of Heart Blood", "d": "Deficiency of Heart Yin"}, "answer": "b", "category": "변증론"}, {"id": 414, "question": "Which of the following options is the therapeutic range for the current used for electroacupuncture?", "choices": {"a": "0.2 to 0.8 A", "b": "1 to 1.5 µA", "c": "1 to 4 µA", "d": "0.5 to 6 mA"}, "answer": "d", "category": "임상의학"}, {"id": 415, "question": "A male who suffers from depression says his moods often fluctuate but most of the time he feels sad. When he is having one of his “episodes” he feels as if ry": "임상의학"}, {"id": 432, "question": "Which of the following acupuncture points is located in the depression between the angle of the mandible and the anterior border of the sternocleidomastoid muscle?", "choices": {"a": "GB12(Wan Gu)", "b": "SI16(Tian Chuang)", "c": "SI17(Tian Rong)", "d": "LI17(Tian Ding)"}, "answer": "c", "category": "침구학"}, {"id": 433, "question": "Which of the following single herbs clears Lower Jiao Damp Heat for dysenteric disorder or painful urinary dribbling?", "choices": {"a": "Dong Gua Zi (Benincasae Semen)", "b": "Ye Ju Hua (Chrysanthemi indici Flos)", "c": "Jin Yin Hua (Lonicerae Flos)", "d": "He Ye (Nelumbinis Folium)"}, "answer": "c", "category": "본초학"}, {"id": 434, "question": "A 44-year-old male enters your clinic. He complains of a headache that started an hour ago. He has vomited twice and has a stiff neck. Upon history taking you are told that he is having “the worst headache” of his life. Which of the conditions does he most likely have?", "choices": {"a": "Subarachnoid hemorrhage", "b": "Epidural hematoma", "c": "Subdural hematoma", "d": "Intracerebral hemorrhage"}, "answer": "a", "category": "기타"}, {"id": 435, "question": "Which of the following Elements has the basic qualities of being able to be bent and straightened? It is interpreted as solidity or workability. Its movement is expansion.", "choices": {"a": "Water", "b": "Wood", "c": "Metal", "d": "Fire"}, "answer": "b", "category": "기타"}, {"id": 436, "question": "Which of the following Elements is associated with transformation?", "choices": {"a": "Wood", "b": "Earth", "c": "Metal", "d": "Fire"}, "answer": "b", "category": "기타"}, {"id": 437, "question": "Which of the following is NOT a natural barrier?", "choices": {"a": "Blood", "b": "Mucus", "c": "Stomach acid", "d": "Tears"}, "answer": "a", "category": "기타"}, {"id": 438, "question": "A 32 year-old female has twisting lower abdominal pain, abdominal distention, pain worse with pressure and abdominal pain that improves w
