gory": "기타"}, {"id": 1258, "question": "A 48 year old obese man has had chest pain for two years. The pain started as dull, and is triggered by fatigue and emotional stress. Now the pain has a stabbing nature which improves with nitroglycerine medication. He has palpitations, cough with thick white phlegm, and shortness of breath. Symptoms are worse with exercise. His complexion is dull and his head feels heavy. He has a poor appetite, loose stools, and sweats easily after exertion. His tongue is dark red with purplish spots and the coat is white and greasy. His pulse is thin, choppy, and soggy. What is his diagnosis?", "choices": {"a": "Deficiency Qi leading to Blood deficiency and Phlegm", "b": "Phlegm Heat blocking the Heart, Qi and Blood stagnation", "c": "Phlegm obstruction leading to Heart Blood stasis, Qi deficiency", "d": "Heart Blood stasis, Lung Phlegm Heat"}, "answer": "c", "category": "변증론"}, {"id": 1259, "question": "You have examined and treated a referred patient. Which of the following is the best action that you would take?", "choices": {"a": "Have your assistant or nurse co-sign your medical records in case there is litigation", "b": "Make sure that your medical records follow the SOAP format", "c": "Document in your medical records that you have sent a report to the referring", "d": "Call the patient after treatment to maintain good rapport"}, "answer": "c", "category": "임상의학"}, {"id": 1260, "question": "According to the discussion of Cold-Induced Disorders (Shang Han Lun), which of the following symptoms belong to the outline of the Tai Yang Shang Han syndrome? I. Superficial pulse II. Aversion to cold III. Occipital headache and neck pain IV . Fever V . Anhidrosis", "choices": {"a": "I and II", "b": "I, II, and IV", "c": "I , II, and III", "d": "All of them"}, "answer": "d", "category": "기타"}, {"id": 1261, "question": "How do you needle the Front Mu of the Lung?", "choices": {"a": "Perpendicular 0.3-0.5", "b": "Oblique 0.3-0.5", "c": "Perpendicular 0.5-0.8", "d": "Oblique 0.5-0.8"}, "answer": "d", "category": "기타"}, {"id": 1262, "question": "SJ5(Wai Guan) and GB41(Zu Lin Qi) do NOT treat？", "choices": {"a": "Outer canthus", "b": "Inner canthus", "c": "Retroauricle", "d": "Cheek"}, "answer": "b", "category": "기타"}, {"id": 1263, "question": "A constitutional weakness of the Lungs often is indicated by?", "choices": {"a": "Cracks in the front part of the tongue", "b": "Chronic cough", "c": "Big chest", "d": "Spontaneous day sweats that do not respond to treatment"}, "answer": "a", "category": "기타"}, {"id": 1264, "question": "A 28-year-old female patient complains of severe stabbing abdominal pain during menstruation accompanied with a pale face, fatigue, a thin tongue coating, and a weak pulse. This condition is characteristic of which pattern?", "choices": {"a": "Qi deficiency with Blood stagnation", "b": "Qi and Blood deficiency", "c": "Qi stagnation and Blood stasis", "d": "Blood deficiency with Qi stagnation"}, "answer": "a", "category": "변증론"}, {"id": 1265, "question": "The point located in the center of the suprascapular fossa is:", "choices": {"a": "SI 12 (Bingfeng)", "b": "SI11(Tian Zong)", "c": "SI 14 (Jianwaishu)", "d": "SI 10 (Naoshu)"}, "answer": "a", "category": "기타"}, {"id": 1266, "question": "How is SP10(Xue Hai) needled?", "choices": {"a": "Perpendicular, 0.5-1.2 cun", "b": "Perpendicular, 1.5-2 cun", "c": "Obliquely upwards, 0.7-1.5 cun", "d": "Oblique laterally, 0.7-1.5 cun"}, "answer": "a", "category": "기타"}, {"id": 1267, "question": "A 55-year-old male police officer, who is overweight and gets little exercise, awoke this morning to find that his eyes and mouth were deviated on the right side. He feels numb from his elbows into his fingers. He is wheezing and making a whistling noise in his throat, and he suffers from aphasia. His tongue is deviated to the right side and coated with a thick greasy coat. His pulse is string-taught and rolling. What is your syndrome differentiation in this case?", "choices": {"a": "Seizure disorder (Xian Zheng)", "b": "Apoplexy", "c": "Bell's Palsy", "d": "Heat Stroke"}, "answer": "b", "category": "변증론"}, {"id": 1268, "question": "All of the following signs indicate acute appendicitis except?", "choices": {"a": "Rovsing’s sign", "b": "Murphy’s sign", "c": "Psoas sign", "d": "Obturator sign"}, "answer": "b", "category": "임상의학"}, {"id": 1269, "question": "Which of the following are incorrect or wrong regarding endometriosis?", "choices": {"a": "Prescription of Progestin and Anti-inflammatory is contraindicated in endometriosis", "b": "Pelvic exam and ultrasound may help to reveal the cysts associated with", "c": "Pelvic pain and cramp that may begin before the menstrual period and extend", "d": "Most commonly involves ovaries, fallopian tubes and tissue lining in pelvis"}, "answer": "a", "category": "임상의학"}, {"id": 1270, "question": "A 48-year-old female had her menstruation only every 2 or 3 months. In her most recent menstrual period the flow was scanty. She was also easily angered and quarreled with her husband, after which she could not sleep all night. She was found not returning home, instead going up onto a rooftop to sing to herself continuously. She was hospitalized for this neurotic behavior, but received ineffective treatment. Now, the following symptoms persist: palpitations, a poor memory, dizziness, tinnitus, lassitude, weakness of the legs and knees, dry throat, afternoon feverishness, night sweats, deep colored urine, a red and peeled tongue with a reddened tip and yellow dry tongue fur, and a superficial-thready-rapid pulse. What is your syndrome differentiation in this case?", "choices": {"a": "Kidney and Heart not harmonized", "b": "Stagnant Liver Qi", "c": "Disturbance of Phlegm due to Stagnation in the Gallbladder", "d": "Flaring Heart Fire"}, "answer": "a", "category": "변증론"}, {"id": 1271, "question": "Which of the following example is the part of ''Inverse Treatment, Tong Yin Yong Yong\", refers to e Middle", "c": "Warm and astringe the Intestines", "d": "Tonify SP Qi, resolve Dampness"}, "answer": "d", "category": "해부생리"}, {"id": 1290, "question": "Which of the following is a Sea of Qi point?", "choices": {"a": "Du 15 (Yamen)", "b": "Ren 15 (Jiuwei)", "c": "S 36 (Zusanli)", "d": "S 8 (Touwei)"}, "answer": "a", "category": "기타"}, {"id": 1291, "question": "Which auricular acupuncture point is located towards the top of the scapha?", "choices": {"a": "Fingers", "b": "Toes", "c": "Shoulder", "d": "Abdomen"}, "answer": "a", "category": "침구학"}, {"id": 1292, "question": "Which of the followings is not a function of Qi?", "choices": {"a": "Promoting", "b": "Warming", "c": "Releasing", "d": "Defensive"}, "answer": "c", "category": "임상의학"}, {"id": 1293, "question": "A 47-year-old woman complains of fibroids, lymph node swelling, and swelling of the nerve ganglia. She has lumps under her skin in many places, red skin eruptions, dry mouth, mental depression, a bearing down sensation in her lower abdomen, and a prolapsed uterus. Her tongue is red. Her pulse is Empty and Rapid. Which of the following diagnoses most accurately represents this case?", "choices": {"a": "Qi Stagnation, Sinking Qi, and Excess Internal Heat", "b": "Phlegm, Qi stagnation, and Deficient Qi", "c": "Sinking Qi, Blood Heat, and Phlegm", "d": "Blood Heat, Phlegm, and Deficient Qi"}, "answer": "c", "category": "변증론"}, {"id": 1294, "question": "In scalp acupuncture, what is the location of the Vision/Optic area?", "choices": {"a": "3 cm lateral to the external occipital protuberance, parallel to the midline and", "b": "4 cm long horizontal line 1.5 cm superior to, and centered over, the auricular apex", "c": "Vertical line 2 cm beside the tuber parietale on the posterior of the head, 3 cm in", "d": "1 cm lateral to the external occipital protuberance, parallel to the midline and"}, "answer": "d", "category": "임상의학"}, {"id": 1295, "question": "Which body type does this describe?: wide jaws, large head, well-developed shoulders and back, well-built muscles.", "choices": {"a": "Earth type", "b": "Metal type", "c": "Wood type", "d": "Fire type"}, "answer": "a", "category": "해부생리"}, {"id": 1296, "question": "Which of the following is NOT a contraindication for performing cupping?", "choices": {"a": "Local skin infection", "b": "Severe edema", "c": "Emaciation", "d": "Bleeding disease"}, "answer": "c", "category": "침구학"}, {"id": 1297, "question": "The major symptoms appear as heat syndrome in the upper and cold in the lower, such as excessive thirst, reflux of gas to the heart, distress and burning sensation in the heart, vomiting of ascaris, endless diarrhea, and cold extremities. In the diagnosis of six stages, this is the case of:", "choices": {"a": "Shao Yang disease", "b": "Jue Yin disease", "c": "Shao Yin disease", "d": "Tai Yin disease"}, "answer": "b", "category": "원론/기초"}, {"id": 1298, "question": "Which is the Fire point of the Foot Shao Yang Channel?", "choices": {"a": "GB36(Wai Qiu)", "b": "GB37(Guang Ming)", "c": "GB38(Yang Fu)", "d": "GB39(Xuan Zhong)"}, "answer": "c", "category": "침구학"}, {"id": 1299, "question": "A patient with chronic cough and asthma caught a common cold, accompanied with fever and aversion to cold. What is the best treatment principle for this case?", "choices": {"a": "Treating the root cause first", "b": "Treating the symptoms first", "c": "Treating the symptoms and root cause simultaneously", "d": "Treating the symptoms and root cause alternately"}, "answer": "b", "category": "해부생리"}, {"id": 1300, "question": "Which is the best choice for treating hypochondriac pain, abdominal pain, dysmenorrhea, irregular menses and breast distention due to Liver Qi stagnation?", "choices": {"a": "Xiang Fu Zi (Nut Grass Rhizome)", "b": "Chuan Lian Zi (Sichuan Pagoda Tree Fruit)", "c": "Chen Pi (Tangerine Peel)", "d": "Wu Yao (Lindera Root)"}, "answer": "a", "category": "본초학"}, {"id": 1301, "question": "Which point is on the same horizontal line as L ly from the stomach area", "d": "Reproduction area – parallel and lateral to the stomach area at a distance equal to"}, "answer": "d", "category": "임상의학"}, {"id": 1328, "question": "Which extra point is located on the palmar surface, at the midpoint of the transverse crease of the proximal interphalangeal joints of the index, middle, ring and little fingers?", "choices": {"a": "Ba Xie", "b": "Ba Feng", "c": "Si Feng", "d": "Shi Xuan"}, "answer": "c", "category": "해부생리"}, {"id": 1329, "question": "Which of the following flavors enters Kindey, and can dry the Blood and should be avoided in cases of Blood Deficiency or heart disease?", "choices": {"a": "Salty", "b": "Pungent", "c": "Sweet", "d": "Sour"}, "answer": "a", "category": "해부생리"}, {"id": 1330, "question": "Which of the following herbs enters the Lung, Large Intestine, and Stomach Channels?", "choices": {"a": "Huang Bai(Phellodendri Cortex)", "b": "Huang Lian(Coptidis Rhizoma)", "c": "Huang Qin(Scutellariae Radix)", "d": "Long Dan Cao(Gentianae Radix)"}, "answer": "c", "category": "본초학"}, {"id": 1331, "question": "Which of the following single herbs softens hardness and dissipates nodules due to Phlegm Fire for neck lumps, severe throat pain, and swelling?", "choices": {"a": "Xuan Shen(Scrophulariae Radix)", "b": "Chai Hu(Bupleuri Radix)", "c": "Bai Wei(Cynanchi atrati Radix)", "d": "Shan Dou Gen(Sophorae tonkinensis Radix)"}, "answer": "a", "category": "본초학"}, {"id": 1332, "question": "Which of the following herbs is acrid and warm?", "choices": {"a": "Chuan Lian Zi(Toosendan Fructus)", "b": "Wu Yao(Linderae Radix)", "c": "Zhi Shi(Aurantii Fructus immaturus)", "d": "Sang Ye(Mori Folium)"}, "answer": "b", "category": "본초학"}, {"id": 1333, "question": "Which of the following single herbs warms and stabilizes Kidneys for urinary incontinence and vaginal discharge?", "choices": {"a": "Gu Sui Bu(Drynariae Rhizoma)", "b": "Gou Ji(Cibotii Rhizoma)", "c": "Xian Mao(Curculiginis Rhizoma)", "d": "Yuan Zhi(Polygalae Radix ity or side effects are reduced or eliminated by another"}, "answer": "b", "category": "임상의학"}, {"id": 1694, "question": "Which of the following acupuncture points descends excess from the head, calms the spirit, and revives consciousness and rescues Yang?", "choices": {"a": "KI1(Yong Quan)", "b": "KI2(Ran Gu)", "c": "Du20(Bai Hui)", "d": "Du26(Shui Gou)"}, "answer": "a", "category": "침구학"}, {"id": 1695, "question": "Which of the following points benefits the eyes, and relaxes the sinews and alleviates pain?", "choices": {"a": "Yin Tang", "b": "Yu Yao", "c": "Er Jian", "d": "Bai Lao"}, "answer": "b", "category": "기타"}, {"id": 1696, "question": "Which of the following single herbs encourages rashes to surface for febrile diseases with rashes that are incompletely expressed?", "choices": {"a": "Lu Gen(Phragmitis Rhizoma)", "b": "Huang Lian(Coptidis Rhizoma)", "c": "Gan Cao(Glycyrrhizae Radix)", "d": "She Gan(Belamcandae Rhizoma)"}, "answer": "a", "category": "본초학"}, {"id": 1697, "question": "A patient visits your clinic complaining of knee pain after playing basketball where they heard a loud pop and felt weakness when extending their leg. They experienced even more pain and popping sounds with flexion of the knee. What is the most likely cause of their knee pain?", "choices": {"a": "Anterior cruciate tear", "b": "Patellar ligament tear", "c": "Medial meniscus tear", "d": "Posterior cruciate tear"}, "answer": "b", "category": "기타"}, {"id": 1698, "question": "Which of the following methods is most effective to clean, soften, or reduce toxicity of herb?", "choices": {"a": "Drying", "b": "Water methods", "c": "Soak with salt", "d": "Cook with alcohol"}, "answer": "b", "category": "본초학"}, {"id": 1699, "question": "Which of the following herbs tonifies Yang?", "choices": {"a": "Dang Gui(Radix Angelicae Sinensis)", "b": "Bai Shao(Radix Paeoniae Alba)", "c": "Lu Jiao Jiao(Cervi Colla Cornus)", "d": "Shu Di Huang(Radix Rehmanniae Preparata)"}, "answer": "c", "category": "본초학"  1724, "question": "There are two types of Yin Deficiency pulses: Rapid Thready or Floating what?", "choices": {"a": "Empty", "b": "Rapid", "c": "Thready", "d": "Moderate"}, "answer": "a", "category": "변증론"}, {"id": 1725, "question": "A patient who has been coming to your clinic for five years says their depression medication is no longer working. It has been recommended to them by their physician that they take SAMe in order to improve the effects of their SSRI. What is your appropriate response?", "choices": {"a": "Your physician is trying to help with absorption so you should also combine this", "b": "Your physician may cause a serotonin syndrome and you can appear \"crazy\"", "c": "Your physician doesn't understand SAMe and may cause you to have seizures", "d": "Your physician may be referring to SAMe increasing the SSRI absorption but use"}, "answer": "d", "category": "임상의학"}, {"id": 1726, "question": "Which of the following anatomical structures lies below BL40(Wei Zhong)?", "choices": {"a": "Carotid", "b": "Popliteal artery", "c": "Femoral artery and vein", "d": "Axillary artery"}, "answer": "b", "category": "임상의학"}, {"id": 1727, "question": "Which of the following Qi controls body temperature?", "choices": {"a": "Yuan Qi", "b": "Wei Qi", "c": "Zhen Qi", "d": "Zhong Qi"}, "answer": "b", "category": "본초학"}, {"id": 1728, "question": "Which of the following organs is in charge of memorizing?", "choices": {"a": "Spleen", "b": "Stomach", "c": "Kidney", "d": "Heart"}, "answer": "a", "category": "기타"}, {"id": 1729, "question": "A 72-year-old woman complains of shortness of breath that is worse when she walks uphill. She has had this for 5 years. She currently feels exhausted and coughs up blood tinged sputum. She is sensitive to cold and has frequent episodes of bronchitis with green- yellow phlegm. She has night sweats, a dry throat, and a feeling of Heat in the afternoon. She is also overweight. Which of the following diagnoses most accurately represents this case?", "choices": {"a": "Wind Cold, Lung Yin deficiency, and Spleen Qi deficiency", "b": "Lung Yin deficiency and Spleen Qi deficiency causing Phlegm", "c": "Kidney Yin deficiency, Lung Dryness, and Phlegm", "d": "Lung Heat, Kidney Yin deficiency, and Empty Fire"}, "answer": "b", "category": "변증론"}, {"id": 1730, "question": "Acupuncture travel kits should be prepared in a way that all items remain clean. The hard sided container must be washed inside and out with soapy water and dried with paper towels. Ziplock bags should be fresh from the package and free of rips and holes. Which of the following times is it required for the practitioner to wash hands?", "choices": {"a": "Before assembling the kit", "b": "Before gathering the ziplock bags", "c": "Before washing the hard sided container", "d": "After washing the hard side container"}, "answer": "a", "category": "임상의학"}, {"id": 1731, "question": "All of the following are an action of Angiotensin II, EXCEPT?", "choices": {"a": "Increase sympathetic activity", "b": "Increase aldosterone secretion", "c": "Arteriolar vasodilation", "d": "Increase Na+ reabsorption"}, "answer": "c", "category": "임상의학"}, {"id": 1732, "question": "Which of the following acupuncture points is located on the radial side of the forearm, 2 cun distal to LI11, on the line connecting LI11 with LI5?", "choices": {"a": "LI10(Shou San Li)", "b": "LI9(Shang Lian)", "c": "LI8(Xia Lian)", "d": "LI12(Zhou Liao)"}, "answer": "a", "category": "침구학"}, {"id": 1733, "question": "Which of the following acupuncture points is located on the dorsal aspect of the head of the ulna, in a cleft level with and to the radial side of the high point of the styloid process of the ulna, and can be found when the palm of the hand is placed on the chest?", "choices": {"a": "SI6(Yang Lao)", "b": "SJ6(Zhi Gou)", "c": "SJ4(Yang Chi)", "d": "SI7(Zhi Zheng)"}, "answer": "a", "category": "침구학"}, {"id": 1734, "question": "A patient presents to you with numbness in her fourth and fifth toes. Which spinal nerve is most likely involved?", "choices": {"a": "S1", "b": "L3", "c": "L4", "d": "L5"}, "answer": "a", "category": "해부생리"}, {"id": 1735, "question": "Wei Qi circulates 50 times in 24 hours. It circulates 25 times at night following which cycle?", "choices": {"a": "LV > SP > KD > HT > LU", "b": "LV > HT > SP > LU > KD", "c": "KD > HT > LU > LV > SP", "d": "HT > LU > LV > SP > KD"}, "answer": "c", "category": "기타"}, {"id": 1736, "question": "Which of the following is NOT eight influential points?", "choices": {"a": "BL11(Da Zhu)", "b": "KI3(Tai Xi)", "c": "BL17(Ge Shu)", "d": "GB34(Yang Ling Quan)"}, "answer": "b", "category": "기타"}, {"id": 1737, "question": "Which of the following organs is the Central Nervous System (CNS) composed of?", "choices": {"a": "Brain & spinal cord", "b": "Brain & eyes", "c": "Somatic & autonomic", "d": "Sympathetic & parasympathetic"}, "answer": "a", "category": "기타"}, {"id": 1738, "question": "A patient presents with swollen, bleeding gums, fatigue, and delayed healing of minor cuts. Deficiency of which vitamin is the most likely cause?", "choices": {"a": "Vitamin B deficiency", "b": "Vitamin C deficiency", "c": "Vitamin A deficiency", "d": "Vitamin D deficiency"}, "answer": "b", "category": "기타"}, {"id": 1739, "question": "Which of the following points treats numbness and pain in the toes due to Bi Syndrome?", "choices": {"a": "Yaoyan", "b": "Pigen", "c": "Bafeng", "d": "Yaoqi"}, "answer": "c", "category": "기타"}, {"id": 1740, "question": "What is a pathological condition in the Five Element controlling cycle in which one element exerts excessive control over another element?", "choices": {"a": "Insulting", "b": "Gnerating", "c": "Overacting", "d": "Controlling"}, "answer": "c", "category": "원론/기초"}, {"id": 1741, "question": "Which of the following channels cross at GB41(Zu Lin Qi)?", "choices": {"a": "Gallbladder and Liver", "b": "Dai and Gallbladder", "c": "Gallbladder and Urinary Bladder", "d": "Gallbladder and Spleen"}, "answer": "b", "category": "원론/기초"}, {"id": 1742, "question": "Which of the following channels cross at GB13?", "choices": {"a": "Gallbladder, Urinary Bladder, and Yang Wei", "b": "Gallbladder, Triple Energizer, Yang Wei, and Yang Qiao", "c": "Gallbladder, Large Intestine, Stomach, Triple Energizer, and Yang Wei", "d": "Gallbladder Yang Wei"}, "answer": "d", "category": "원론/기초"}, {"id": 1743, "question": "Eyes that show alertness and are shiny, physical appearance and color that are bright, mind that is clear, clear speech and normal behavior, even respiration, good appetite and normal bowel movements are all a case of which indication?", "choices": {"a": "Strong Shen", "b": "Shen disturbance", "c": "False Shen", "d": "Shen obscurity"}, "answer": "a", "category": "기타"}, {"id": 1744, "question": "When managing a stuck needle, the practitioner should not take which of the following actions?", "choices": {"a": "Massage or lightly tap the skin around the needle", "b": "Insert another needle close by the stuck needle to help the muscle relax", "c": "Remove the needle following the course of the bend", "d": "Tell the patient to relax their muscles"}, "answer": "c", "category": "임상의학"}, {"id": 1745, "question": "The Jing River point of the Foot Tai Yang Channel is located in which of the following areas of the body?", "choices": {"a": "In the depression, between the lateral malleolus and the tendo calcaneus", "b": "3 cun above from the lateral malleolus", "c": "In the depression, directly below the lateral malleolus", "d": "below the tuberosity of the fifth metatarsal bone"}, "answer": "a", "category": "임상의학"}, {"id": 1746, "question": "Which of the following organs controls the reception of Qi?", "choices": {"a": "Heart", "b": "Kidney", "c": "Spleen", "d": "Liver"}, "answer": "b", "category": "기타"}, {"id": 1747, "question": "A male comes in with excruciatingly painful, red and swollen tongue ulcers as well as red eyes. He complains of his tongue and eyes burning. He is often dizzy and he sometimes hears a loud ringing in his ears that comes on suddenly. He says that he hasn't slept much for the past few days. He often has a bitter taste in his mouth and is extremely thirsty. He also has asthma for the past 10 years. He has shortness of breath and is slightly wheezy. He has huge sweat stains in his armpits. He tells you that he is really tired and has felt that way for the past few months. His tongue is pale but red on the sides and the tip. His pulse is Weak on the right but Wiry and Rapid on the left. What is the diagnosis for this case?", "choices": {"a": "Liver Fire with Heart Phlegm Fire and Spleen and Lung Qi Deficiency", "b": "Heart Fire with Liver Qi Stagnation with Liver Fire Insulting the Lung", "c": "Liver and Heart Fire with Lung Qi Deficiency", "d": "Liver Yang Rising with Liver and Kidney Yin Deficiency and Lung Dryness"}, "answer": "c", "category": "변증론"}, {"id": 1748, "question": "what is the distance between the front Mu point of Stomach and the front Mu point of Heart?", "choices": {"a": "1 cun", "b": "2 cun", "c": "3 cun", "d": "4 cun"}, "answer": "b", "category": "침구학"}, {"id": 1749, "question": "Which of the following points tonifies ST Qi and Yang?", "choices": {"a": "UB15(Xin Shu)", "b": "UB21(Wei Shu)", "c": "UB20(Pi Shu)", "d": "UB19(Dan Shu)"}, "answer": "b", "category": "기타"}, {"id": 1750, "question": "A patient in his 40s complains of chronic pain in the lumbar region that comes on slowly and subtly. The pain is aggravated by fatigue and alleviated by bed rest. His accompanying symptoms include coldness in the limbs, frequent urination at night, lassitude and weakness of the loins and knees, occasional nocturnal emissions, and a pale tongue. Which of the following treatment methods is best suited for this case?", "choices": {"a": "Warm and recuperate Kidney Yang", "b": "Nourish and invigorate Kidney Yin", "c": "Promote blood circulation to remove stagnant Blood and stop the pain", "d": "Expel Cold by warming the Meridians and expelling the Damp Evil"}, "answer": "a", "category": "변증론"}, {"id": 1751, "question": "Tremor and/or facial tic, dry eyes with blurred vision, numbness/tingling of the limbs, headache, backache, scanty urination, and possible hypertension. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Liver Wind from Liver Yin Deficiency causing Liver Yang Rising", "b": "Liver Yang Rising", "c": "Liver Wind from Liver and Kidney Yin Deficiency causing Liver Yang Rising", "d": "Liver Yin Deficiency"}, "answer": "c", "category": "변증론"}, {"id": 1752, "question": "A female has severe stabbing pain in the epigastrium that is worse at night for two weeks. Accompanying symptoms include nausea and daily vomiting with vomit looks like coffee grounds. Her tongue is purple at center and her pulse is Choppy. Which of the following differential diagnoses most accurately describes this case?", "choices": {"a": "Stomach Blood Stasis", "b": "Heart Blood Stasis", "c": "Liver Blood Deficiency", "d": "Liver Blood Stasis"}, "answer": "a", "category": "변증론"}, {"id": 1753, "question": "Where is the ear point for the Lung located?", "choices": {"a": "Scapha", "b": "Cavum concha", "c": "Triangular fossa", "d": "Lobule"}, "answer": "b", "category": "기타"}, {"id": 1754, "question": "Which of the following acupuncture points is located on the abdomen, 2 cun lateral to the midline, and level with CV14(Ju Que)?", "choices": {"a": "ST19(Bu Rong)", "b": "ST20(Cheng Man)", "c": "ST21(Liang Men)", "d": "ST18(Ru Gen)"}, "answer": "a", "category": "침구학"}, {"id": 1755, "question": "Frequent and urgent urination, dysuria that stops mid-flow, turbid urine, and feeling of heaviness in the hypogastrium and urethra. Which of the following diagnoses best describes this case?", "choices": {"a": "Urinary Bladder Damp Cold", "b": "Urinary Bladder Damp Heat", "c": "Urinary Bladder Interstitial Cystitis", "d": "Urinary Bladder Deficiency Cold"}, "answer": "a", "category": "변증론"}, {"id": 1756, "question": "Cyanosis of the lips and nails, palpitations, a constricted feeling of the chest with a stabbing or pricking pain that radiates to the inner aspect of the left shoulder. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Purple on the tip and sides; Choppy, Wiry and Knotted", "b": "Purple, dry coat; Choppy and Weak", "c": "Purple with a red tip and midline crack; slightly Rapid and Choppy", "d": "Slightly pale on the tip and sides; Empty and slightly Overflowing"}, "answer": "a", "category": "임상의학"}, {"id": 1757, "question": "Fever which is more severe during the night and disappearing at morning, normal appetite with weight loss, red tongue with little coating, and a deep, thready rapid pulse due to spring warm febrile disease are the clinical symptoms of which pattern?", "choices": {"a": "Internal Wind due to extreme heat", "b": "Pathogenic factor remaining at the Yin portion", "c": "Yangming Fu Syndrome with Impairment of Qi and body fluids", "d": "Yangming Fu Syndrome with SI Heat"}, "answer": "b", "category": "변증론"}, {"id": 1758, "question": "Which organ  participates in the final transformation of Qi through the catalytic actions of Y uan Qi which transforms Zong Qi into Zhen Qi?", "choices": {"a": "Spleen", "b": "Liver", "c": "Kidney", "d": "Stomach"}, "answer": "c", "category": "임상의학"}, {"id": 1759, "question": "Mental confusion, possible fever at night but with cold hands and feet, incoherent speech or aphasia, and possible macules. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Pericardium Qi Stagnation", "b": "Pericardium Fire", "c": "Pericardium Heat", "d": "Heart Fire"}, "answer": "c", "category": "변증론"}, {"id": 1760, "question": "Dizziness, insomnia, dream-disturbed sleep, poor memory, anxiety, propensity to be startled, palpitations, dull-pale complexion, fatigue, muscle weakness, and scanty periods. Which of the following diagnoses best suits this case?", "choices": {"a": "Spleen Qi Deficiency", "b": "Spleen Qi Sinking", "c": "Spleen Not Controlling Blood", "d": "Spleen and Heart Blood Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 1761, "question": "Nocturia, bladder pain, urinary frequency and urgency, slight incontinence, and urinary hesitancy. What is the diagnosis?", "choices": {"a": "Kidney Qi deficiency", "b": "Lung Qi deficiency", "c": "Kidney Yang deficiency", "d": "Kidney Yin deficiency"}, "answer": "a", "category": "변증론"}, {"id": 1762, "question": "Cups can be disinfected with a high-level disinfection hydrogen peroxide solution consisting of which of the following percentages for how long?", "choices": {"a": "3.0% hydrogen peroxide; six hours", "b": "7.3% hydrogen peroxide; six hours", "c": "7.3% hydrogen peroxide; three hours", "d": "3.0% hydrogen peroxide; three hours"}, "answer": "b", "category": "임상의학"}, {"id": 1763, "question": "What point acts as a local point for chest pain and strengthens the Kidney function of not receiving Qi?", "choices": {"a": "KD25(Shen Cang)", "b": "KD21(You Men)", "c": "KD12(Da He)", "d": "KD10(Yin Gu)"}, "answer": "a", "category": "임상의학"}, {"id": 1764, "question": "Which of the followings is associated with the Metal element?", "choices": {"a": "black", "b": "transform", "c": "north", "d": "pungent"}, "answer": "d", "category": "기타"}, {"id": 1765, "question": "Which of the following channels cross at TE17(Yi Feng)?", "choices": {"a": "Triple Energizer and Gallbladder", "b": "Triple Energizer, Gallbladder, and Yang Wei", "c": "Triple Energizer, Small Intestine, and Gallbladder", "d": "Triple Energizer and Yang Wei"}, "answer": "a", "category": "원론/기초"}, {"id": 1766, "question": "Which points are indicated for heaviness of the body and joint pain?", "choices": {"a": "Shu-Stream points", "b": "He-sea points", "c": "Jing-river points", "d": "Jing-spring points"}, "answer": "a", "category": "해부생리"}, {"id": 1767, "question": "Which of the following organs makes Blood?", "choices": {"a": "Spleen", "b": "Heart", "c": "Kidney", "d": "Liver"}, "answer": "a", "category": "기타"}, {"id": 1768, "question": "What is the expected incubation period of Hepatitis E?", "choices": {"a": "15-60 days", "b": "30-90 days", "c": "14-180 days", "d": "45-160 days"}, "answer": "a", "category": "임상의학"}, {"id": 1769, "question": "Which of the following points treats infantile malnutrition due to gastrointestinal parasites?", "choices": {"a": "Zi Gong Xue", "b": "Si Feng", "c": "Bai Chong Wo", "d": "Yao Yan"}, "answer": "c", "category": "해부생리"}, {"id": 1770, "question": "A 28 years old female complains of dry eyes. She says this has been happening since she started menstruating at the age of 16. She uses eye drops daily but it doesn’t do much good. She tells you that her eyes are dry and her vision is blurry. Sometimes she gets spots before her eyes when she stands up. She doesn’t sleep well and takes 10mg of Melatonin nightly. Her complexion is dull pale without much luster, but she has some blush on her cheeks. Her hair is very dry as well as her skin. Her tongue is of a normal color with no coat. Her pulse is floating deficient. Which of the following differential diagnoses most accurately describes this case?", "choices": {"a": "Heart and Kidney Yin Deficiency", "b": "Liver and Heart Blood Deficiency", "c": "Liver Blood Deficiency", "d": "Liver Yin Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 1771, "question": "Dry stools, infertility, scanty menstruation, dizziness, tinnitus, hardness of hearing, lower backache, dull occipital or vertex headache, and insomnia. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Red body, no coat; Rapid, Empty, Wiry", "b": "Normal body, no coat or rootless coat; Floating, Empty", "c": "Pale body, thick white coat; Floating, Empty, Slow", "d": "Normal body; Empty"}, "answer": "b", "category": "기타"}, {"id": 1772, "question": "What is the distance between the Earth point and the Luo-connecting point of the Heart meridian?", "choices": {"a": "0.5 cun", "b": "1 cun", "c": "1.5 cun", "d": "2 cun"}, "answer": "b", "category": "임상의학"}, {"id": 1773, "question": "Which of the following points benefits the lumbar region and knees, activates the Channel and alleviates pain, cools the Blood, clears Summer Heat, stops vomiting and diarrhea, and benefits the Urinary Bladder?", "choices": {"a": "UB43(Gao Huang Shu)", "b": "UB48(Yang Gang)", "c": "UB40(Wei Zhong)", "d": "UB57(Cheng Shan)"}, "answer": "c", "category": "임상의학"}, {"id": 1774, "question": "Which of the following acupuncture points is located the same level with the lower border of the spinous process of the fifth thoracic vertebra?", "choices": {"a": "BL35(Hui Yang)", "b": "BL43(Gao Huang)", "c": "BL44(Shen Tang)", "d": "BL45(Yi Xi)"}, "answer": "c", "category": "침구학"}, {"id": 1775, "question": "Which of the following points eliminates Wind, benefits the head and eyes, clears the sense organs, activates the Channel, and alleviates pain?", "choices": {"a": "GB9(Tian Chong)", "b": "GB21(Jian Jing)", "c": "GB13(Ben Shen)", "d": "GB20(Feng Chi)"}, "answer": "d", "category": "임상의학"}, {"id": 1776, "question": "Which of the following Elements is associated with the sighing sound?", "choices": {"a": "Fire", "b": "Earth", "c": "Wood", "d": "Water"}, "answer": "c", "category": "기타"}, {"id": 1777, "question": "A 16-year-old female patient complains of a fever that she has had for the last two days.  Her symptoms at first were a slight fever, an aversion to Cold and Wind, headache, anhidrosis, coughing that produces thin white phlegm, and a stuffy nose. Yesterday, the fever became much worse.  She now has a slight aversion to Wind and Cold, slight hidrosis, pain in the throat, a slight dry mouth, coughing that produces yellow phlegm, a red tongue with Page 133 of 134 yellow fur, and a Floating and Rapid pulse. Which of the following diagnoses more accurately represents this case?", "choices": {"a": "Wind Heat Evil attacking the Lung", "b": "Wind Cold Evil tightening the Lung", "c": "Stagnant Phlegm Heat in the Lung", "d": "Stagnant Heat Evil in the Lung"}, "answer": "a", "category": "변증론"}, {"id": 1778, "question": "Lower backache, fatigue, scanty clear urination, nocturia, apathy, edema of the legs, chronic diarrhea especially in the morning, desire to lie down, loose stools, depression, and decreased libido. Which of the following tongue and pulse presentations most accurately describes this case?", "choices": {"a": "Pale body, wet coat; Deep, Weak", "b": "Swollen body, thick white coat; Deep, Weak, Slow", "c": "Pale body, no coat; Deep, Weak, Slightly Rapid", "d": "Normal body, thin white coat; Weak both rear positions"}, "answer": "a", "category": "임상의학"}, {"id": 1779, "question": "Patient presents with a floating pulse on all three positions and the pulse is beating straight up and down. Which extraordinary channel is affected?", "choices": {"a": "Du (Governing)", "b": "Chong  (Penetrating)", "c": "Ren  (Directing)", "d": "Dai  (Girdle)"}, "answer": "a", "category": "변증론"}, {"id": 1780, "question": "How many kidney points are on the chest?", "choices": {"a": "8", "b": "10", "c": "12", "d": "14"}, "answer": "c", "category": "기타"}, {"id": 1781, "question": "Poor appetite, slight abdominal distention after eating, fatigue, lassitude, dull and pale complexion, loose stools, depression, thin body, and insomnia. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Pale and thin body, slightly dry coat; Choppy, Fine", "b": "Thin body, yellow coat; Fine, Slightly Rapid", "c": "Red body, slightly dry yellow coat; Rapid, Fine Choppy", "d": "Pale body, thick white coat; Fine, Deep"}, "answer": "a", "category": "임상의학"}, {"id": 1782, "question": "Flaring of the nostrils in a person with high fever indicates which pattern?", "choices": {"a": "Lung Heat", "b": "Stomach Fire", "c": "Blood Stasis", "d": "Invasion of the Spleen by Liver Qi"}, "answer": "a", "category": "변증론"}, {"id": 1783, "question": "Which point is often used for a one-sided headache, principally due to Liver qi stagnation or uprising of Liver Fire or Liver Yang, chest pain, bitter-taste, and is an important point to treat wandering Bi?", "choices": {"a": "GB36(Wai Qiu)", "b": "GB37(Guang Ming)", "c": "GB38(Yang Fu)", "d": "GB39(Xuan Zhong)"}, "answer": "c", "category": "변증론"}, {"id": 1784, "question": "A female has suffered from insomnia for the past 3 years. She is often anxious and often wakes up with anxiety. She finds herself jumping at the littlest thing. Her mouth and throat are often dry. Which of the following differential diagnoses most accurately describe her condition?", "choices": {"a": "Pericardium Heat", "b": "Heart Blood Deficiency", "c": "Pericardium Blood Deficiency", "d": "Heart Yin Deficiency"}, "answer": "d", "category": "변증론"}, {"id": 1785, "question": "A 32-year-old woman has had epilepsy since the age of 15. She has severe convulsions, loss of consciousness, and foaming at the mouth. She has a history of migraines, tinnitus, and irritability. The pulse is Fine, Fast, and String-Taut. Her tongue is pale, with very red sides, stiff, and with a thick, sticky yellow coat. Which of the following diagnoses most accurately describes this case?", "choices": {"a": "Liver Yang Rising and Phlegm Misting the Mind", "b": "Deficient Liver Blood and Yin and Excess Internal Phlegm Wind", "c": "Liver Fire Blazing, Phlegm Wind, and Deficient Blood", "d": "Liver Wind, Phlegm, Spleen Qi deficiency, and Liver Blood deficiency"}, "answer": "c", "category": "변증론"}, {"id": 1786, "question": "Which of the following acupuncture points is located 3 cun lateral to the midline, at the level of the 4th posterior sacral foramen?", "choices": {"a": "BL54(Zhi Bian)", "b": "BL34(Xia Liao)", "c": "BL30(Bai Huan Shu)", "d": "BL45(Yi Xi)"}, "answer": "a", "category": "침구학"}, {"id": 1787, "question": "Practitioner’s hands should be washed with soap and water in all BUT which of the following scenarios?", "choices": {"a": "On arrival and before leaving work", "b": "Between patients", "c": "When hands are dirty with some organic matter, such as blood", "d": "Before eating and after restroom use"}, "answer": "b", "category": "임상의학"}, {"id": 1788, "question": "Which of the following acupuncture points is located in the depression on the supraorbital margin, at the lateral end of the eyebrow?", "choices": {"a": "TE24(Jiao Sun)", "b": "TE22(Er He Liao)", "c": "TE23(Si Zhu Kong)", "d": "TE21(Er Men)"}, "answer": "c", "category": "침구학"}, {"id": 1789, "question": "Which of the following points treats Organ Heat, Wind Heat, Blood Heat, Toxic Heat and Deficiency Heat?", "choices": {"a": "LI6(Pian Li)", "b": "LI11(Qu Chi)", "c": "LI20(Ying Xiang)", "d": "LI4(He Gu)"}, "answer": "b", "category": "기타"}, {"id": 1790, "question": "Insomnia, blurred vision, floaters in the eyes, heavy menstruation, very dry hair and skin, red cheekbones with malar flush, and slight anxiety. Which of the following diagnoses best represents this case?", "choices": {"a": "Liver Blood deficiency", "b": "Liver Yin deficiency", "c": "Liver Blood stasis", "d": "Liver Yin deficiency with Empty Heat"}, "answer": "b", "category": "변증론"}, {"id": 1791, "question": "Blocked or runny nose with yellow nasal discharge, headache and body aches, cough, sore throat, and aversion to cold with slight sweating. Which of the following tongue and pulse presentations most accurately represent this case?", "choices": {"a": "Pale body, no coat; Empty, Floating", "b": "Red body, no coat; Rapid, Floating, Thin", "c": "Slightly red; Floating, Rapid", "d": "Red body, redder sides; Rapid, Overflowing"}, "answer": "c", "category": "기타"}, {"id": 1792, "question": "What is a pathological condition in the Five Element when the controlled element becomes excessively strong a     let state = {
      currentScreen: 'home',
      mode: 'sequential',
      currentIndex: 0,
      selectedAnswer: null,
      showAnswer: false,
      questionOrder: [],

      retryAnswers: {},
      bookmarked: new Set(),

      reported: new Set(),

      retryStats: { correct: 0, wrong: 0, total: 0 },
      modeProgress: {}

    document.addEventListener('keydown', handleKeyPress);
    
    function handleKeyPress(e) {
      if (state.currentScreen !== 'quiz') return;
      const key = e.key.toLowerCase();
      
      if (['1', '2', '3', '4'].includes(key) && !state.showAnswer) {
        const currentQ = QUESTIONS[state.questionOrder[state.currentIndex]];
        const choices = Object.keys(currentQ.choices || {});
        const index = parseInt(key) - 1;
        if (index < choices.length) {
          selectAnswer(choices[index]);
        }
        e.preventDefault();
      }
      
      if (key === 'enter') {
        if (!state.showAnswer && state.selectedAnswer) {
          submitAnswer();
        } else if (state.showAnswer && state.currentIndex < state.questionOrder.length - 1) {
          nextQuestion();
        }
        e.preventDefault();
      }
      
      if (key === 'arrowright' && state.currentIndex < state.questionOrder.length - 1) {
        nextQuestion();
        e.preventDefault();
      }
      if (key === 'arrowleft' && state.currentIndex > 0) {
        prevQuestion();
        e.preventDefault();
      }
    }
    
    function loadData() {
      try {
        const saved = localStorage.getItem('mce2-eng-sky-data');
        if (saved) {
          const data = JSON.parse(saved);
          state.userAnswers = data.userAnswers || {};
          state.retryAnswers = data.retryAnswers || {};
          state.bookmarked = new Set(data.bookmarked || []);
          state.dontKnow = new Set(data.dontKnow || []);
          state.reported = new Set(data.reported || []);
          state.stats = data.stats || { correct: 0, wrong: 0, total: 0 };
          state.retryStats = data.retryStats || { correct: 0, wrong: 0, total: 0 };
          state.modeProgress = data.modeProgress || {};
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
      state.questionOrder = QUESTIONS.map((_, i) => i);
    }
    
    function saveData() {
      try {
        localStorage.setItem('mce2-eng-sky-data', JSON.stringify({
          userAnswers: state.userAnswers,
          retryAnswers: state.retryAnswers,
          bookmarked: Array.from(state.bookmarked),
          dontKnow: Array.from(state.dontKnow),
          reported: Array.from(state.reported),
          stats: state.stats,
          retryStats: state.retryStats,
          modeProgress: state.modeProgress
        }));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    }
    
    function saveModeProgress() {
      state.modeProgress[state.mode] = {
        currentIndex: state.currentIndex,
        questionOrder: state.questionOrder,
        timestamp: Date.now()
      };
      saveData();
    }

        renderHome(app);
      } else if (state.currentScreen === 'quiz') {

      } else if (state.currentScreen === 'stats') {
        renderStats(app);
      }

    function renderQuiz(app) {
      const currentQ = QUESTIONS[state.questionOrder[state.currentIndex]];
      const progress = ((state.currentIndex + 1) / state.questionOrder.length) * 100;
      const isReviewMode = state.mode === 'wrong-review';
      const isRetryMode = state.mode === 'wrong-retry';
      const previousAnswer = isReviewMode ? state.userAnswers[currentQ.id] : null;
      
      const solvedInMode = state.questionOrder.filter(idx => {
        const q = QUESTIONS[idx];
        return state.userAnswers[q.id] !== undefined;
      }).length;
      const modeProgress = Math.round((solvedInMode / state.questionOrder.length) * 100);
      
      const sessionAccuracy = state.stats.total > 0 ? Math.round((state.stats.correct / state.stats.total) * 100) : 0;
      
      let choicesHTML = '';
      Object.entries(currentQ.choices || {}).forEach(([key, value], index) => {
        const isSelected = state.selectedAnswer === key;
        const isCorrect = key === currentQ.answer;
        const showCorrect = state.showAnswer && isCorrect;
        const showWrong = state.showAnswer && isSelected && !isCorrect;
        const isPrevious = isReviewMode && previousAnswer && previousAnswer.selected === key;
        
        let className = 'choice';
        if (showCorrect) className += ' correct';

        else if (isSelected) className += ' selected';
        
        choicesHTML += `

      let modeLabel = '';

      else if (state.mode === 'wrong-retry') modeLabel = 'Retry';
      else if (state.mode === 'dontknow') modeLabel = 'Unsure';
      else if (state.mode.indexOf('category-') === 0) modeLabel = ({'침구학':'Acupuncture','본초학':'Herbology','변증론':'Pattern ID','원론/기초':'Theory','해부생리':'Anatomy','임상의학':'Clinical Med','윤리/법규':'Ethics/Law','진단학':'Diagnosis'})[state.mode.replace('category-','')] || state.mode.replace('category-','');
      
      app.innerHTML = `

            <div style="font-size: 11px; color: var(--text-light); letter-spacing: 1px; text-transform: uppercase;">${modeLabel}</div>

        <div class="progress-bar">

        <div class="card">

            <div style="display: flex; gap: 8px;">

              <button onclick="toggleDontKnow()" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--sky-tint); background: ${state.dontKnow.has(currentQ.id) ? 'var(--sky-tint)' : 'white'}; cursor: pointer;">❓</button>

      `;

    function renderStats(app) {
      const accuracy = state.stats.total > 0 ? Math.round((state.stats.correct / state.stats.total) * 100) : 0;

      app.innerHTML = `

    function updateNav() {
      let navDiv = document.querySelector('.nav-buttons');
      
      if (state.currentScreen === 'quiz') {
        if (!navDiv) {
          navDiv = document.createElement('div');
          navDiv.className = 'nav-buttons';
          document.body.appendChild(navDiv);
        }
        
        navDiv.innerHTML = `
          <button class="nav-btn" onclick="prevQuestion()" ${state.currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="nav-btn" onclick="nextQuestion()" ${state.currentIndex === state.questionOrder.length - 1 ? 'disabled' : ''}>Next →</button>
        `;
      } else {
        if (navDiv) navDiv.remove();
      }
    }
    
    function startMode(mode) {
      state.mode = mode;
      
      if (mode === 'sequential') {
        state.questionOrder = QUESTIONS.map((_, i) => i);
      } else if (mode === 'random') {
        state.questionOrder = QUESTIONS.map((_, i) => i).sort(() => Math.random() - 0.5);
      } else if (mode.indexOf('category-') === 0) {
        var category = mode.replace('category-', '');
        state.questionOrder = [];
        for (var i = 0; i < QUESTIONS.length; i++) {
          if (QUESTIONS[i].category === category) {
            state.questionOrder.push(i);
          }
        }
        if (state.questionOrder.length === 0) {
          alert('No questions in this category.');
          return;
        }
      } else if (mode === 'bookmarked') {
        state.questionOrder = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => state.bookmarked.has(q.id)).map(({ i }) => i);
        if (state.questionOrder.length === 0) {
          alert('No bookmarked questions yet.');
          return;
        }
      } else if (mode === 'wrong-review' || mode === 'wrong-retry') {
        state.questionOrder = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => state.userAnswers[q.id] && !state.userAnswers[q.id].correct).map(({ i }) => i);
        if (state.questionOrder.length === 0) {
          alert('No missed questions yet — try some questions first!');
          return;
        }
      } else if (mode === 'dontknow') {
        state.questionOrder = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => state.dontKnow.has(q.id)).map(({ i }) => i);
        if (state.questionOrder.length === 0) {
          alert('No questions marked as unknown.');
          return;
        }
      }
      
      if (state.modeProgress[mode] && state.modeProgress[mode].currentIndex !== undefined) {
        state.currentIndex = state.modeProgress[mode].currentIndex;
        if (mode === 'random' && state.modeProgress[mode].questionOrder) {
          state.questionOrder = state.modeProgress[mode].questionOrder;
        }
      } else {
        state.currentIndex = 0;
      }
      
      state.selectedAnswer = null;
      state.showAnswer = false;
      state.currentScreen = 'quiz';
      render();
      updateNav();
    }
    
    function goHome() {
      saveModeProgress();
      state.currentScreen = 'home';
      render();
      updateNav();
    }
    
    function showStats() {
      state.currentScreen = 'stats';
      render();
      updateNav();
    }
    
    function selectAnswer(answer) {
      if (!state.showAnswer) {
        state.selectedAnswer = answer;
        render();
        updateNav();
      }
    }
    
    function submitAnswer() {
      if (!state.selectedAnswer || state.showAnswer) return;
      
      const currentQ = QUESTIONS[state.questionOrder[state.currentIndex]];
      const isCorrect = state.selectedAnswer === currentQ.answer;
      
      if (state.mode === 'wrong-retry') {
        state.retryAnswers[currentQ.id] = {
          selected: state.selectedAnswer,
          correct: isCorrect,
          timestamp: Date.now()
        };
        state.retryStats.correct += isCorrect ? 1 : 0;
        state.retryStats.wrong += isCorrect ? 0 : 1;
        state.retryStats.total += 1;
        
        if (isCorrect) {
          state.userAnswers[currentQ.id] = {
            selected: state.selectedAnswer,
            correct: true,
            timestamp: Date.now()
          };
        }
      } else {
        state.userAnswers[currentQ.id] = {
          selected: state.selectedAnswer,
          correct: isCorrect,
          timestamp: Date.now()
        };
        state.stats.correct += isCorrect ? 1 : 0;
        state.stats.wrong += isCorrect ? 0 : 1;
        state.stats.total += 1;
      }
      
      state.showAnswer = true;
      saveData();
      render();
      updateNav();
    }
    
    function nextQuestion() {
      if (state.currentIndex < state.questionOrder.length - 1) {
        state.currentIndex++;
        state.selectedAnswer = null;
        state.showAnswer = false;
        saveModeProgress();
        render();
        updateNav();
        window.scrollTo(0, 0);
      }
    }
    
    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        state.selectedAnswer = null;
        state.showAnswer = false;
        saveModeProgress();
        render();
        updateNav();
        window.scrollTo(0, 0);
      }
    }
    
    function toggleBookmark() {
      const currentQ = QUESTIONS[state.questionOrder[state.currentIndex]];
      if (state.bookmarked.has(currentQ.id)) {
        state.bookmarked.delete(currentQ.id);
      } else {
        state.bookmarked.add(currentQ.id);
      }
      saveData();
      render();
      updateNav();
    }
    
    function toggleDontKnow() {
      const currentQ = QUESTIONS[state.questionOrder[state.currentIndex]];
      if (state.dontKnow.has(currentQ.id)) {
        state.dontKnow.delete(currentQ.id);
      } else {
        state.dontKnow.add(currentQ.id);
      }
      saveData();
      render();
      updateNav();
    }
    
    function resetData() {
      if (confirm('Are you sure you want to reset all progress?\n\nThis cannot be undone.')) {
        try {
          localStorage.removeItem('mce2-eng-sky-data');
          localStorage.clear();
        } catch (e) {
          console.error('localStorage clear error:', e);
        }
        
        state.userAnswers = {};
        state.retryAnswers = {};
        state.bookmarked = new Set();
        state.dontKnow = new Set();
        state.reported = new Set();
        state.stats = { correct: 0, wrong: 0, total: 0 };
        state.retryStats = { correct: 0, wrong: 0, total: 0 };
        state.modeProgress = {};
        
        alert('All data will be cleared.');
        window.location.reload();
      }
    }
    
    loadData();
    render();
    updateNav();
  </script>
</body>
</html>
